name: ✨ Feature Request
description: Suggest a new idea or enhancement for the dashboard or autonomous agent.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! We are continuously expanding the capabilities of Kirito Server Dashboard and our autonomous AI Agent.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Any alternative solutions or features you've considered.
  - type: dropdown
    id: component
    attributes:
      label: Targeted Component
      options:
        - AI Agent Service (Python / 9Router / Telegram / Social Bots)
        - Auth Service (Java / JWT)
        - Metrics Service (Java / Telemetry)
        - File Service (Java / SFTP)
        - Frontend (React 19 / Vite / Cyberpunk HUD)
        - Database (PostgreSQL / Migrations)
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or architectural diagrams here.
