# Dependabot version updates configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # React frontend (Node / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Spring Boot Auth Service (Maven)
  - package-ecosystem: "maven"
    directory: "/services/auth-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Spring Boot Metrics Service (Maven)
  - package-ecosystem: "maven"
    directory: "/services/metrics-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Spring Boot File Service (Maven)
  - package-ecosystem: "maven"
    directory: "/services/file-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Python AI Agent Service (pip)
  - package-ecosystem: "pip"
    directory: "/services/ai-agent-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Docker images (Dockerfile + docker-compose.yml at root)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
