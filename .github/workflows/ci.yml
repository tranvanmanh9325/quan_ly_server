name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify-judge-freeze:
    name: Verify Judge Freeze & Anti-Overfit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Judge Freeze & Protocol Integrity
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python -c "
          import json, hashlib, subprocess, re, sys, os
          from pathlib import Path

          print('=' * 70)
          print('VERIFYING JUDGE FREEZE & INTEGRITY PROTOCOL')
          print('=' * 70)

          # 1. Load frozen manifest
          manifest_path = Path('config/acceptance_manifest.json')
          if not manifest_path.exists():
              print('FATAL ERROR: config/acceptance_manifest.json not found!')
              sys.exit(1)

          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = json.load(f)

          judge_files = set(manifest.get('files', {}).keys())
          judge_files.add('config/acceptance_manifest.json')
          print(f'Total {len(judge_files)} frozen judge files registered in manifest.')

          # 2. Determine modified files via git diff
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          base_ref = os.environ.get('GITHUB_BASE_REF', '')
          before_sha = os.environ.get('EVENT_BEFORE', '')

          cmd = None
          if event_name == 'pull_request' and base_ref:
              cmd = ['git', 'diff', '--name-only', f'origin/{base_ref}...HEAD']
              print(f'PR Mode: comparing against origin/{base_ref}')
          elif event_name == 'push' and before_sha and not re.match(r'^0+$', before_sha):
              cmd = ['git', 'diff', '--name-only', f'{before_sha}..HEAD']
              print(f'Push Mode: comparing against {before_sha[:8]}')
          else:
              try:
                  head_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
                  origin_sha = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
                  if head_sha == origin_sha:
                      cmd = ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD']
                      print('Direct Push/Local Mode: comparing HEAD~1 against HEAD')
                  else:
                      cmd = ['git', 'diff', '--name-only', 'origin/main...HEAD']
                      print('Branch Mode: comparing against origin/main')
              except Exception as e:
                  cmd = ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD']
                  print(f'Fallback Diff Mode: {e}')

          res = subprocess.run(cmd, capture_output=True, text=True)
          if res.returncode != 0:
              res = subprocess.run(['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'], capture_output=True, text=True)

          diff_files = [f.strip().replace('\\\\', '/') for f in res.stdout.splitlines() if f.strip()]
          modified_judge = [
              f for f in diff_files 
              if f in judge_files or f.startswith('tools/acceptance/') or f == 'config/acceptance_manifest.json'
          ]

          # 3. Protocol enforcement: If judge modified, require FREEZE-BREAK in commit message
          if modified_judge:
              print(f'WARNING: Detected {len(modified_judge)} modified Judge/Manifest file(s):')
              for mj in modified_judge:
                  print(f'  - {mj}')

              commit_msg = subprocess.check_output(['git', 'log', '-1', '--pretty=%B'], text=True).strip()
              fb_match = re.search(r'\bFREEZE-BREAK:\s*(.+)', commit_msg, re.IGNORECASE)
              if not fb_match:
                  print('=' * 70)
                  print('[SECURITY ALERT] UNAUTHORIZED MODIFICATION OF FROZEN ACCEPTANCE JUDGE!')
                  print('=' * 70)
                  print('Modification of Judge tools or manifest requires the FREEZE-BREAK protocol.')
                  print(f'Current Commit Message:\n  \"{commit_msg}\"\n')
                  print('To authorize this change, the commit message MUST contain:')
                  print('  FREEZE-BREAK: <detailed justification>\n')
                  print('=' * 70)
                  sys.exit(1)
              else:
                  reason = fb_match.group(1).strip()
                  print(f'[FREEZE-BREAK PROTOCOL AUTHORIZED]')
                  print(f'  Reason: {reason}')
          else:
              print('[OK] Zero Judge or Manifest files modified in this changeset.')

          # 4. Bit-for-bit SHA-256 hash check against manifest
          mismatch = 0
          for rel_path, exp_hash in manifest.get('files', {}).items():
              p = Path(rel_path)
              if not p.exists():
                  print(f'MISSING FILE: {rel_path}')
                  mismatch += 1
                  continue
              act_hash = hashlib.sha256(p.read_bytes()).hexdigest()
              if act_hash != exp_hash:
                  print(f'HASH MISMATCH in {rel_path}: expected {exp_hash}, got {act_hash}')
                  mismatch += 1
              else:
                  print(f'HASH OK: {rel_path}')

          if mismatch > 0:
              print(f'FAILED: {mismatch} file(s) do not match manifest hashes!')
              sys.exit(1)

          print('=' * 70)
          print('SUCCESS: Judge freeze and bit-for-bit integrity verified 100%!')
          print('=' * 70)
          "

      - name: Run Anti-Overfitting Linter
        run: python tools/lint_no_overfit.py

      - name: Verify Report Claims & Snapshots
        run: python tools/verify_report_claims.py

  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, file-service, metrics-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: services/${{ matrix.service }}

  test-ai-agent:
    name: Test AI Agent Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/ai-agent-service/requirements.txt

      - name: Install System Dependencies (ffmpeg, tesseract-ocr)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-vie

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-agent-service/requirements.txt

      - name: Syntax Check
        run: python -m compileall services/ai-agent-service/app

      - name: Run Unit Tests
        run: python -m unittest discover -s services/ai-agent-service/tests
        env:
          PYTHONPATH: "services/ai-agent-service"
          JWT_SECRET: "ci-dummy-jwt-secret-key-for-testing-only-123456789"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          TESTING: "true"
          CI: "true"
          PUBLIC_DOWNLOAD_BASE_URL: "http://127.0.0.1:8084"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew
        working-directory: android-app

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: quan-ly-server-assistant-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 7