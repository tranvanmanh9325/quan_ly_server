name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, file-service, metrics-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: services/${{ matrix.service }}

  test-ai-agent:
    name: Test AI Agent Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/ai-agent-service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-agent-service/requirements.txt

      - name: Syntax Check
        run: python -m compileall services/ai-agent-service/app

      - name: Run Unit Tests
        run: python -m unittest discover -s services/ai-agent-service/tests
        env:
          JWT_SECRET: "ci-dummy-jwt-secret-key-for-testing-only-123456789"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend