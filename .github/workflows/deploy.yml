name: Auto Deploy to Ngrok Server

on:
  push:
    branches:
      - main # Chỉ chạy deploy khi có code mới đẩy vào nhánh main

jobs:
  deploy:
    name: Kéo code & Rebuild Docker
    runs-on: self-hosted # Chạy lệnh trực tiếp trên server của bạn

    steps:
      - name: Thực thi script cập nhật Server
        run: |
          # 1. Di chuyển vào thư mục code hiện tại chứa file .env
          cd ~/quan_ly_server
          
          # 2. Hủy bỏ mọi thay đổi cục bộ (nếu có lỡ sửa gì đó trực tiếp trên server)
          git reset --hard
          
          # 3. Kéo code mới nhất từ GitHub nhánh main
          git pull origin main
          
          # 4. Yêu cầu Docker compose build lại hệ thống ở background (không gây downtime lớn)
          docker compose up -d --build
