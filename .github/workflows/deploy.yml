name: Auto Deploy to Server

on:
  push:
    branches: [ "main" ]

# Require CI to pass before deploying
concurrency:
  group: deploy
  cancel-in-progress: false  # Never cancel a running deploy

permissions:
  contents: read

jobs:
  # ── Build verification (GitHub-hosted, fast feedback) ─────────────────────
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            services/auth-service/pom.xml
            services/file-service/pom.xml
            services/metrics-service/pom.xml

      - name: Backend compile check
        run: |
          mvn clean compile -q -f services/auth-service/pom.xml
          mvn clean compile -q -f services/file-service/pom.xml
          mvn clean compile -q -f services/metrics-service/pom.xml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: AI Agent syntax check
        run: python -m compileall services/ai-agent-service/app

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install + build
        run: npm ci && npm run build
        working-directory: frontend

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── Deploy (self-hosted runner ON the server) ─────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: verify          # Only deploy if verify passes
    environment: production

    steps:
      - name: Pull latest code
        run: |
          cd ~/quan_ly_server
          git fetch origin main
          git reset --hard origin/main

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist-temp

      - name: Sync Artifact to Frontend
        run: |
          rm -rf ~/quan_ly_server/frontend/dist
          mkdir -p ~/quan_ly_server/frontend/dist
          cp -r frontend-dist-temp/* ~/quan_ly_server/frontend/dist/
          rm -rf frontend-dist-temp

      - name: Rebuild and restart containers
        run: |
          cd ~/quan_ly_server
          FRONTEND_BUILD_TARGET=ci docker compose up -d --build --remove-orphans

      - name: Verify all containers healthy
        run: |
          echo "Waiting 30s for containers to stabilize..."
          sleep 30
          docker compose -f ~/quan_ly_server/docker-compose.yml ps
          # Fail the step if any container is not running
          docker compose -f ~/quan_ly_server/docker-compose.yml ps --format json \
            | python3 -c "
          import json, sys
          containers = [json.loads(l) for l in sys.stdin if l.strip()]
          failed = [c['Name'] for c in containers if c.get('State') != 'running']
          if failed:
              print('FAILED containers:', failed)
              sys.exit(1)
          print('All containers running:', [c[\"Name\"] for c in containers])
          "
