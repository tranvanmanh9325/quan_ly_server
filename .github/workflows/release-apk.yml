name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Bản phát hành ứng dụng Android - Quan Ly Server Assistant'
      release_notes:
        description: 'Release Notes'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved Tag: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew
        working-directory: android-app

      - name: Prepare Keystore for Signing
        id: setup-keystore
        run: |
          mkdir -p android-app/keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android-app/keystore/release.jks
            echo "keystore_path=keystore/release.jks" >> $GITHUB_OUTPUT
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "Notice: No RELEASE_KEYSTORE_BASE64 secret found. Falling back to build.gradle.kts debug fallback signing."
            echo "has_secret=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ steps.setup-keystore.outputs.has_secret == 'true' && steps.setup-keystore.outputs.keystore_path || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Package & Generate Checksum
        id: package-apk
        run: |
          VERSION="${{ steps.versioning.outputs.tag }}"
          SOURCE_DIR="android-app/app/build/outputs/apk/release"
          
          APK_FILE=$(ls ${SOURCE_DIR}/*.apk | head -n 1)
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: Output APK not found!"
            exit 1
          fi
          
          FINAL_APK_NAME="quan-ly-server-assistant-${VERSION}.apk"
          FINAL_APK_PATH="${SOURCE_DIR}/${FINAL_APK_NAME}"
          mv "$APK_FILE" "$FINAL_APK_PATH"
          
          cd "$SOURCE_DIR"
          sha256sum "${FINAL_APK_NAME}" > "${FINAL_APK_NAME}.sha256"
          
          echo "apk_path=${FINAL_APK_PATH}" >> $GITHUB_OUTPUT
          echo "sha_path=${SOURCE_DIR}/${FINAL_APK_NAME}.sha256" >> $GITHUB_OUTPUT
          echo "apk_name=${FINAL_APK_NAME}" >> $GITHUB_OUTPUT
          echo "Build finished: ${FINAL_APK_NAME}"

      - name: Clean Keystore
        if: always()
        run: |
          rm -rf android-app/keystore/release.jks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ github.event.inputs.release_title || format('Bản phát hành ứng dụng Android {0}', steps.versioning.outputs.tag) }}
          body: |
            ## 📱 Quan Ly Server Assistant (${{ steps.versioning.outputs.tag }})

            Ứng dụng Android điều khiển và quản trị máy chủ cá nhân tích hợp Trợ lý ảo AI & Không gian Buồng lái 3D.

            ### 📦 Thông tin tệp cài đặt:
            - **Tệp cài đặt:** `${{ steps.package-apk.outputs.apk_name }}`
            - **Tính toàn vẹn (SHA-256):** Kèm tệp `${{ steps.package-apk.outputs.apk_name }}.sha256`
            - **Hệ điều hành hỗ trợ:** Android 8.0 (API 26) trở lên
            - **Trạng thái chữ ký:** Đã ký số v1 + v2 hợp lệ, sẵn sàng cài đặt trực tiếp.

            ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package-apk.outputs.apk_path }}
            ${{ steps.package-apk.outputs.sha_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
