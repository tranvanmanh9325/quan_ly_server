name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Quan Ly Server Assistant - Android Release'
      release_notes:
        description: 'Release Notes'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved Tag: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew
        working-directory: android-app

      - name: Prepare Keystore for Signing
        id: setup-keystore
        run: |
          mkdir -p android-app/keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android-app/keystore/release.jks
            echo "keystore_path=${GITHUB_WORKSPACE}/android-app/keystore/release.jks" >> $GITHUB_OUTPUT
            echo "keystore_password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "key_password=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "Notice: No RELEASE_KEYSTORE_BASE64 secret found. Generating CI release keystore on the fly..."
            keytool -genkeypair -v \
              -keystore android-app/keystore/release.jks \
              -alias quanlyserver \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android123" \
              -keypass "android123" \
              -dname "CN=QuanLyServer, OU=Mobile, O=QuanLyServer, L=Hanoi, ST=Hanoi, C=VN"
            echo "keystore_path=${GITHUB_WORKSPACE}/android-app/keystore/release.jks" >> $GITHUB_OUTPUT
            echo "keystore_password=android123" >> $GITHUB_OUTPUT
            echo "key_alias=quanlyserver" >> $GITHUB_OUTPUT
            echo "key_password=android123" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ steps.setup-keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ steps.setup-keystore.outputs.keystore_password }}
          KEY_ALIAS: ${{ steps.setup-keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.setup-keystore.outputs.key_password }}

      - name: Package & Generate Checksum
        id: package-apk
        run: |
          VERSION="${{ steps.versioning.outputs.tag }}"
          SOURCE_DIR="android-app/app/build/outputs/apk/release"
          
          APK_FILE=$(ls ${SOURCE_DIR}/*.apk | head -n 1)
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: Output APK not found!"
            exit 1
          fi
          
          FINAL_APK_NAME="quan-ly-server-assistant-${VERSION}.apk"
          FINAL_APK_PATH="${SOURCE_DIR}/${FINAL_APK_NAME}"
          mv "$APK_FILE" "$FINAL_APK_PATH"
          
          cd "$SOURCE_DIR"
          sha256sum "${FINAL_APK_NAME}" > "${FINAL_APK_NAME}.sha256"
          
          echo "apk_path=${FINAL_APK_PATH}" >> $GITHUB_OUTPUT
          echo "sha_path=${SOURCE_DIR}/${FINAL_APK_NAME}.sha256" >> $GITHUB_OUTPUT
          echo "apk_name=${FINAL_APK_NAME}" >> $GITHUB_OUTPUT
          echo "Build finished: ${FINAL_APK_NAME}"

      - name: Clean Keystore
        if: always()
        run: |
          rm -rf android-app/keystore/release.jks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ github.event.inputs.release_title || format('Quan Ly Server Assistant {0}', steps.versioning.outputs.tag) }}
          body: |
            ## 📱 Quan Ly Server Assistant (${{ steps.versioning.outputs.tag }})

            Official Android Client for Server Management & AI Assistant featuring an Ultra-Realistic 3D Sci-Fi Spaceship Cockpit Bridge.

            ### 📦 Package Information:
            - **Binary Asset:** `${{ steps.package-apk.outputs.apk_name }}`
            - **Integrity Checksum:** Verified via `${{ steps.package-apk.outputs.apk_name }}.sha256`
            - **Supported OS:** Android 8.0+ (API 26+)
            - **Signature Status:** Signed with valid APK Signature Scheme v1 + v2, ready for direct installation.

            ### 🚀 What's New in this Release:
            - **Photorealistic Sci-Fi Spaceship Bridge**: Completely overhauled cockpit with panoramic forward canopy, aft bulkhead airlock, and anti-glare titanium floor.
            - **Obstacle-Free Extended Zoom (0.85m - 12.0m)**: Removed all blocking struts; seamless zoom from face close-up to ultra-wide cockpit vista.
            - **Cinematic Dynamic Auto-Framing**: Automatically shifts target focus to face during close-ups and to torso during wide angles.
            - **Ultra-Minimalist HUD & Auto Idle Director**: Clean floating cyber pills for 3 environments (Nebula, Orbit, Warp) and automatic 5s idle smooth glide with 360° slow cinematic orbit.

            ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package-apk.outputs.apk_path }}
            ${{ steps.package-apk.outputs.sha_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
