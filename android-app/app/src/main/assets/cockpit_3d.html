<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>Tiểu Bảo Bảo Ultra-Realistic Sci-Fi Spaceship Cockpit</title>
  <!-- Three.js + OrbitControls + GLTFLoader loaded locally via WebViewAssetLoader -->
  <script src="https://appassets.androidplatform.net/assets/js/three.min.js"></script>
  <script src="https://appassets.androidplatform.net/assets/js/OrbitControls.js"></script>
  <script src="https://appassets.androidplatform.net/assets/js/GLTFLoader.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010612;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      touch-action: none;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
      touch-action: none;
      z-index: 1;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Status Badge gọn gàng ở đỉnh màn hình */
    .status-badge {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 18, 32, 0.85);
      border: 1px solid rgba(0, 255, 234, 0.6);
      color: #00ffea;
      font-size: 11px;
      padding: 4px 16px;
      border-radius: 12px;
      z-index: 20;
      font-family: monospace;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(0, 255, 234, 0.35);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Telemetry HUD góc trên bên trái */
    .hud-telemetry {
      position: absolute;
      top: 44px;
      left: 10px;
      background: rgba(0, 16, 28, 0.80);
      border: 1px solid rgba(0, 229, 255, 0.45);
      padding: 6px 10px;
      border-radius: 8px;
      color: #7df9ff;
      font-family: monospace;
      font-size: 9.5px;
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.25);
      backdrop-filter: blur(6px);
      line-height: 1.35;
    }

    .hud-telemetry h4 {
      font-size: 10px;
      letter-spacing: 1px;
      color: #00ffea;
      margin-bottom: 3px;
    }

    /* Cụm nút chuyển đổi Môi trường Không gian (Ergonomic Thumb Zone) */
    .env-group {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }

    .btn-env {
      flex: 1;
      background: rgba(0, 24, 48, 0.92);
      border: 1px solid rgba(0, 229, 255, 0.55);
      color: #00e5ff;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 10px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 6px rgba(0, 229, 255, 0.2);
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
      pointer-events: auto !important;
      touch-action: manipulation !important;
    }

    .btn-env:active, .btn-env.active {
      background: rgba(0, 229, 255, 0.38);
      border-color: #00ffea;
      color: #ffffff;
      box-shadow: 0 0 10px #00ffea;
    }

    /* Thanh điều khiển đa kênh phía dưới */
    .controls-panel {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 30;
      width: 95%;
      max-width: 460px;
      pointer-events: auto !important;
      touch-action: manipulation !important;
    }

    /* Container thanh trượt */
    .slider-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 20, 36, 0.92);
      border: 1px solid rgba(0, 229, 255, 0.5);
      padding: 5px 12px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .slider-container label {
      color: #00e5ff;
      font-size: 10px;
      font-weight: bold;
      font-family: monospace;
      white-space: nowrap;
      min-width: 65px;
    }

    .cyber-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(0, 229, 255, 0.25);
      outline: none;
    }

    .cyber-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00ffea;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffea;
    }

    .btn-group {
      display: flex;
      gap: 5px;
      width: 100%;
      justify-content: center;
    }

    .btn-3d {
      flex: 1;
      background: rgba(0, 25, 48, 0.92);
      border: 1px solid #00e5ff;
      color: #00e5ff;
      padding: 7px 3px;
      border-radius: 10px;
      font-size: 10px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 6px rgba(0, 229, 255, 0.25);
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      pointer-events: auto !important;
      touch-action: manipulation !important;
    }

    .btn-3d:active {
      background: rgba(0, 229, 255, 0.45);
      color: #fff;
      transform: scale(0.96);
    }

    .btn-preset {
      border-color: #7df9ff;
      color: #7df9ff;
      background: rgba(0, 42, 75, 0.92);
    }

    /* Màn hình tải 3D */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #010612;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: #00ffea;
      font-family: monospace;
      font-size: 13px;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 255, 234, 0.2);
      border-top: 3px solid #00ffea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">KHỞI ĐỘNG BUỒNG LÁI TÀU VŨ TRỤ CHỈ HUY...</div>
  </div>

  <!-- Status Badge -->
  <div class="status-badge">⚡ COMMAND BRIDGE // AI COCKPIT</div>

  <!-- Telemetry HUD -->
  <div class="hud-telemetry">
    <h4>QUANTUM BRIDGE v4.1</h4>
    <div>VISTA: THREE.JS NEBULA / PBR</div>
    <div>PANORAMIC: STRUTS & CONSOLE</div>
    <div>TARGET: AUTO-FRAMED FOCUS</div>
  </div>

  <!-- WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <!-- Cụm chọn Không Gian Vũ Trụ (Ergonomic Thumb Zone) -->
    <div class="env-group">
      <button class="btn-env active" id="btn-env-nebula">🌌 Tinh Vân</button>
      <button class="btn-env" id="btn-env-orbit">🪐 Hành Tinh</button>
      <button class="btn-env" id="btn-env-warp">⚡ Siêu Không Gian</button>
    </div>

    <!-- Slider Xoay 360° -->
    <div class="slider-container">
      <label>XOAY 360°:</label>
      <input type="range" id="rot-slider" class="cyber-slider" min="0" max="360" value="0">
      <span id="angle-display" style="color:#00e5ff; font-family:monospace; font-size:10.5px; min-width:30px; text-align:right;">0°</span>
    </div>

    <!-- Slider Thu Phóng Cự Ly -->
    <div class="slider-container">
      <label>K/CÁCH:</label>
      <input type="range" id="zoom-slider" class="cyber-slider" min="1.2" max="4.8" step="0.05" value="3.2">
      <span id="zoom-display" style="color:#00e5ff; font-family:monospace; font-size:10.5px; min-width:30px; text-align:right;">3.2m</span>
    </div>

    <!-- Cụm nút chuyển góc và thu phóng nhanh -->
    <div class="btn-group">
      <button class="btn-3d" id="btn-auto-rot">🔄 Tự Xoay</button>
      <button class="btn-3d" id="btn-front">🎯 Chính Diện</button>
      <button class="btn-3d" id="btn-back">🔄 Sau Lưng</button>
      <button class="btn-3d btn-preset" id="btn-zoom-in">🔍 Cận Cảnh</button>
      <button class="btn-3d btn-preset" id="btn-zoom-out">🌌 Toàn Cảnh</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. KHỞI TẠO THREE.JS RENDERER & SCENE
    // ==========================================
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    // Camera Perspective tối ưu cho màn hình dọc (Portrait)
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 350);
    camera.position.set(0, 1.22, 3.2);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.30;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // ==========================================
    // 2. ORBITCONTROLS (KHÓA CHẶT TÂM NGẮM & THU PHÓNG ĐA KÊNH)
    // ==========================================
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    // Khởi tạo tâm ngắm cân đối vào ngực nhân vật
    controls.target.set(0, 1.15, 0);

    // [CỐT LÕI KHẮC PHỤC LỖI LỆCH TÂM]: TẮT PAN
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.zoomSpeed = 1.1;
    controls.minDistance = 1.25;
    controls.maxDistance = 4.8;
    controls.minPolarAngle = Math.PI * 0.28;
    controls.maxPolarAngle = Math.PI * 0.54;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 1.0;

    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    // ==========================================
    // 3. HỆ THỐNG ÁNH SÁNG ĐIỆN ẢNH (CINEMATIC LIGHTING)
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0x101a2e, 1.4);
    scene.add(ambientLight);

    // Key Light chiếu sáng nhân vật từ trần buồng lái
    const keyLight = new THREE.DirectionalLight(0xdff0ff, 2.4);
    keyLight.position.set(0, 4.2, 2.2);
    keyLight.castShadow = true;
    keyLight.shadow.bias = -0.001;
    scene.add(keyLight);

    // Rim Light 1: Kicker Cyan hắt sáng viền tóc và vai từ ngoài vũ trụ
    const rimLightCyan = new THREE.DirectionalLight(0x00f0ff, 3.8);
    rimLightCyan.position.set(0, 2.2, -4.0);
    rimLightCyan.target.position.set(0, 1.15, 0);
    scene.add(rimLightCyan);
    scene.add(rimLightCyan.target);

    // Rim Light 2: Kicker Magenta tạo chiều sâu tương phản Hollywood
    const rimLightMagenta = new THREE.PointLight(0xff0088, 2.4, 8);
    rimLightMagenta.position.set(2.2, 1.6, -1.8);
    scene.add(rimLightMagenta);

    // Đèn phát quang từ sàn tàu và bàn điều khiển
    const floorGlowLight = new THREE.PointLight(0x00ffea, 2.5, 5.0);
    floorGlowLight.position.set(0, 0.45, 0.6);
    scene.add(floorGlowLight);

    // ==========================================
    // 4. VẬT LIỆU PBR SCI-FI CHUẨN ĐIỆN ẢNH
    // ==========================================
    const matTitanium = new THREE.MeshStandardMaterial({
      color: 0x141f2e,
      roughness: 0.32,
      metalness: 0.85
    });

    const matDarkCarbon = new THREE.MeshStandardMaterial({
      color: 0x0a1018,
      roughness: 0.48,
      metalness: 0.50
    });

    const matNeonCyan = new THREE.MeshStandardMaterial({
      color: 0x00f5ff,
      emissive: 0x00f5ff,
      emissiveIntensity: 3.2,
      roughness: 0.2,
      metalness: 0.1
    });

    const matNeonAmber = new THREE.MeshStandardMaterial({
      color: 0xffaa00,
      emissive: 0xff8800,
      emissiveIntensity: 2.8,
      roughness: 0.2,
      metalness: 0.1
    });

    const matNeonRed = new THREE.MeshStandardMaterial({
      color: 0xff2244,
      emissive: 0xff1133,
      emissiveIntensity: 3.0,
      roughness: 0.2,
      metalness: 0.1
    });

    // ==========================================
    // 5. BUỒNG LÁI TÀU VŨ TRỤ (CANOPY STRUTS & CONSOLE)
    // ==========================================
    const cockpitGroup = new THREE.Group();

    // 5.1. Khung vòm kính góc cạnh (A-Pillars & Struts)
    function createCanopyStruts() {
      const strutGroup = new THREE.Group();
      const pillarGeo = new THREE.CylinderGeometry(0.08, 0.12, 4.2, 6);

      const leftPillar = new THREE.Mesh(pillarGeo, matTitanium);
      leftPillar.position.set(-1.75, 1.8, -0.6);
      leftPillar.rotation.z = -0.22;
      leftPillar.rotation.y = 0.35;
      strutGroup.add(leftPillar);

      const rightPillar = new THREE.Mesh(pillarGeo, matTitanium);
      rightPillar.position.set(1.75, 1.8, -0.6);
      rightPillar.rotation.z = 0.22;
      rightPillar.rotation.y = -0.35;
      strutGroup.add(rightPillar);

      const archGeo = new THREE.TorusGeometry(2.35, 0.08, 8, 36, Math.PI * 0.82);
      const archMesh = new THREE.Mesh(archGeo, matTitanium);
      archMesh.position.set(0, 1.45, -0.7);
      archMesh.rotation.x = Math.PI * 0.45;
      archMesh.rotation.z = Math.PI * 0.09;
      strutGroup.add(archMesh);

      // Dải LED Neon Cyan chạy dọc khung vòm
      const neonArchGeo = new THREE.TorusGeometry(2.33, 0.02, 6, 36, Math.PI * 0.82);
      const neonArchMesh = new THREE.Mesh(neonArchGeo, matNeonCyan);
      neonArchMesh.position.copy(archMesh.position);
      neonArchMesh.rotation.copy(archMesh.rotation);
      strutGroup.add(neonArchMesh);

      return strutGroup;
    }
    cockpitGroup.add(createCanopyStruts());

    // 5.2. Bàn điều khiển phi thuyền bo cong ôm phía trước nhân vật
    function createFlightConsole() {
      const consoleGroup = new THREE.Group();

      // Cung tròn ôm phía trước nhân vật (bán kính 1.25m - 1.42m)
      const arcStart = Math.PI * 0.22;
      const arcLength = Math.PI * 0.56;

      // Thân bàn điều khiển bán nguyệt
      const bodyGeo = new THREE.CylinderGeometry(1.22, 1.36, 0.45, 32, 1, true, arcStart, arcLength);
      const bodyMesh = new THREE.Mesh(bodyGeo, matDarkCarbon);
      bodyMesh.position.set(0, 0.65, 0);
      consoleGroup.add(bodyMesh);

      // Mặt trên táp-lô vát góc bọc titanium
      const topGeo = new THREE.RingGeometry(1.10, 1.38, 32, 1, arcStart, arcLength);
      const topMesh = new THREE.Mesh(topGeo, matTitanium);
      topMesh.rotation.x = -Math.PI / 2;
      topMesh.position.set(0, 0.875, 0);
      consoleGroup.add(topMesh);

      // Viền LED Neon Cyan uốn lượn theo gờ bàn điều khiển
      const neonRingGeo = new THREE.RingGeometry(1.36, 1.39, 32, 1, arcStart, arcLength);
      const neonRing = new THREE.Mesh(neonRingGeo, matNeonCyan);
      neonRing.rotation.x = -Math.PI / 2;
      neonRing.position.set(0, 0.88, 0);
      consoleGroup.add(neonRing);

      // Hàng phím công tắc phát quang cơ khí (Backlit Switches)
      const switchGeo = new THREE.BoxGeometry(0.04, 0.025, 0.06);
      for (let i = -6; i <= 6; i++) {
        const ang = (Math.PI / 2) + (i * 0.065);
        const mat = (Math.abs(i) === 6) ? matNeonRed : ((i % 2 === 0) ? matNeonAmber : matNeonCyan);
        const sw = new THREE.Mesh(switchGeo, mat);
        const r = 1.24;
        sw.position.set(Math.cos(ang) * r, 0.89, Math.sin(ang) * r);
        sw.rotation.y = -ang + Math.PI / 2;
        consoleGroup.add(sw);
      }

      // Cần điều khiển bay kép (HOTAS Dual Flight Sticks)
      function createFlightStick(xPos, zPos, angleY) {
        const stick = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.075, 0.03, 16), matTitanium);
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.018, 0.20, 12), matTitanium);
        shaft.position.y = 0.11;
        const grip = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.09, 0.05), matDarkCarbon);
        grip.position.set(0, 0.20, 0);
        const trig = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.02, 0.02), matNeonRed);
        trig.position.set(0, 0.22, 0.025);

        stick.add(base, shaft, grip, trig);
        stick.position.set(xPos, 0.88, zPos);
        stick.rotation.y = angleY;
        return stick;
      }
      consoleGroup.add(createFlightStick(-0.45, 1.15, 0.35));
      consoleGroup.add(createFlightStick(0.45, 1.15, -0.35));

      return consoleGroup;
    }
    cockpitGroup.add(createFlightConsole());

    // 5.3. Sàn tàu hợp kim Titanium & Đèn LED âm sàn
    function createTitaniumFloor() {
      const floorGroup = new THREE.Group();

      const floorGeo = new THREE.PlaneGeometry(10, 10);
      const floorMesh = new THREE.Mesh(floorGeo, matDarkCarbon);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.position.y = -0.01;
      floorMesh.receiveShadow = true;
      floorGroup.add(floorMesh);

      // Dải LED Neon âm sàn chạy dọc
      const channelGeo = new THREE.PlaneGeometry(0.05, 5.0);
      const leftCh = new THREE.Mesh(channelGeo, matNeonCyan);
      leftCh.rotation.x = -Math.PI / 2;
      leftCh.position.set(-1.05, 0.002, 0.8);
      floorGroup.add(leftCh);

      const rightCh = new THREE.Mesh(channelGeo, matNeonCyan);
      rightCh.rotation.x = -Math.PI / 2;
      rightCh.position.set(1.05, 0.002, 0.8);
      floorGroup.add(rightCh);

      // Bệ chỉ huy 2 tầng
      const daisBase = new THREE.Mesh(new THREE.CylinderGeometry(1.80, 1.90, 0.10, 8), matTitanium);
      daisBase.position.set(0, 0.05, 0);
      floorGroup.add(daisBase);

      const daisTop = new THREE.Mesh(new THREE.CylinderGeometry(1.58, 1.62, 0.08, 32), matDarkCarbon);
      daisTop.position.set(0, 0.14, 0);
      floorGroup.add(daisTop);

      const ringLed = new THREE.Mesh(new THREE.RingGeometry(1.40, 1.45, 36), matNeonCyan);
      ringLed.rotation.x = -Math.PI / 2;
      ringLed.position.set(0, 0.182, 0);
      floorGroup.add(ringLed);

      return floorGroup;
    }
    cockpitGroup.add(createTitaniumFloor());
    scene.add(cockpitGroup);

    // ==========================================
    // 6. HỆ SINH THÁI VŨ TRỤ ĐA TẦNG (3 CHẾ ĐỘ MÔI TRƯỜNG)
    // ==========================================
    const envGroup = new THREE.Group();
    scene.add(envGroup);

    let currentEnvMode = 'nebula';

    // --- CHẾ ĐỘ 1: COSMIC NEBULA (TINH VÂN VŨ TRỤ RỰC RỠ) ---
    const nebulaSubGroup = new THREE.Group();
    function initNebulaEnvironment() {
      const nebCanvas = document.createElement('canvas');
      nebCanvas.width = 1024;
      nebCanvas.height = 512;
      const ctx = nebCanvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 1024, 512);
      bgGrad.addColorStop(0, '#0a031e');
      bgGrad.addColorStop(0.3, '#1d063f');
      bgGrad.addColorStop(0.7, '#071b3e');
      bgGrad.addColorStop(1, '#050214');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1024, 512);

      function drawGlowBlob(x, y, rad, color) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
        g.addColorStop(0, color);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      drawGlowBlob(320, 200, 260, 'rgba(0, 150, 255, 0.60)');
      drawGlowBlob(720, 260, 280, 'rgba(255, 0, 138, 0.55)');
      drawGlowBlob(512, 170, 220, 'rgba(180, 40, 255, 0.50)');
      drawGlowBlob(200, 360, 210, 'rgba(0, 240, 255, 0.45)');

      const nebTex = new THREE.CanvasTexture(nebCanvas);
      const domeGeo = new THREE.SphereGeometry(80, 32, 16);
      // TẮT FOG trên bầu trời tinh vân để màu sắc luôn rực rỡ sắc nét
      const domeMat = new THREE.MeshBasicMaterial({ map: nebTex, side: THREE.BackSide, fog: false });
      const nebDome = new THREE.Mesh(domeGeo, domeMat);
      nebulaSubGroup.add(nebDome);

      // Cụm sao lấp lánh 3D
      const starGeo = new THREE.BufferGeometry();
      const starCount = 1400;
      const starPos = new Float32Array(starCount * 3);
      const starCols = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const r = 40 + Math.random() * 35;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        starPos[i * 3 + 2] = r * Math.cos(phi);

        const isPink = Math.random() > 0.6;
        starCols[i * 3] = isPink ? 1.0 : 0.4;
        starCols[i * 3 + 1] = isPink ? 0.4 : 0.9;
        starCols[i * 3 + 2] = 1.0;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(starCols, 3));
      const starMat = new THREE.PointsMaterial({ size: 0.22, vertexColors: true, transparent: true, opacity: 0.95, fog: false });
      const nebStars = new THREE.Points(starGeo, starMat);
      nebulaSubGroup.add(nebStars);

      envGroup.add(nebulaSubGroup);
    }
    initNebulaEnvironment();

    // --- CHẾ ĐỘ 2: PLANETARY ORBIT & ASTEROID BELT (HÀNH TINH KHỔNG LỒ) ---
    const orbitSubGroup = new THREE.Group();
    let planetMesh = null;
    let asteroidBelt = null;
    function initOrbitEnvironment() {
      const pGeo = new THREE.SphereGeometry(18, 48, 24);
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 512;
      pCanvas.height = 256;
      const pCtx = pCanvas.getContext('2d');
      const pGrad = pCtx.createLinearGradient(0, 0, 0, 256);
      pGrad.addColorStop(0, '#031f40');
      pGrad.addColorStop(0.5, '#0e528a');
      pGrad.addColorStop(1, '#05294e');
      pCtx.fillStyle = pGrad;
      pCtx.fillRect(0, 0, 512, 256);
      pCtx.fillStyle = 'rgba(120, 225, 255, 0.4)';
      for (let i = 0; i < 9; i++) {
        pCtx.fillRect(0, 30 + i * 24, 512, 10);
      }

      const pMat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(pCanvas),
        fog: false
      });
      planetMesh = new THREE.Mesh(pGeo, pMat);
      // Đặt hành tinh cao hơn và nhìn rõ từ cửa kính vòm
      planetMesh.position.set(0, 2.0, -22.0);
      orbitSubGroup.add(planetMesh);

      // Atmospheric Glow
      const atmoGeo = new THREE.SphereGeometry(18.35, 48, 24);
      const atmoMat = new THREE.MeshBasicMaterial({
        color: 0x00d4ff,
        transparent: true,
        opacity: 0.40,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        fog: false
      });
      const atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
      atmoMesh.position.copy(planetMesh.position);
      orbitSubGroup.add(atmoMesh);

      // Vành đai sao thiên thạch
      const ringGeo = new THREE.BufferGeometry();
      const ringCount = 1000;
      const ringPos = new Float32Array(ringCount * 3);
      for (let i = 0; i < ringCount; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = 21 + Math.random() * 6.5;
        ringPos[i * 3] = Math.cos(ang) * rad;
        ringPos[i * 3 + 1] = (Math.random() - 0.5) * 1.0;
        ringPos[i * 3 + 2] = Math.sin(ang) * rad;
      }
      ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
      const ringMat = new THREE.PointsMaterial({ color: 0x99ddff, size: 0.20, transparent: true, opacity: 0.85, fog: false });
      asteroidBelt = new THREE.Points(ringGeo, ringMat);
      asteroidBelt.position.copy(planetMesh.position);
      asteroidBelt.rotation.z = 0.35;
      orbitSubGroup.add(asteroidBelt);

      orbitSubGroup.visible = false;
      envGroup.add(orbitSubGroup);
    }
    initOrbitEnvironment();

    // --- CHẾ ĐỘ 3: HYPERSPACE WARP JUMP (SIÊU KHÔNG GIAN) ---
    const warpSubGroup = new THREE.Group();
    const warpCount = 2000;
    const warpGeo = new THREE.BufferGeometry();
    const warpPositions = new Float32Array(warpCount * 6);
    const warpSpeeds = new Float32Array(warpCount);

    function initWarpEnvironment() {
      for (let i = 0; i < warpCount; i++) {
        const x = (Math.random() - 0.5) * 70;
        const y = (Math.random() - 0.5) * 70;
        const z = -Math.random() * 160;
        const len = 4.0 + Math.random() * 6.5;

        warpPositions[i * 6] = x;
        warpPositions[i * 6 + 1] = y;
        warpPositions[i * 6 + 2] = z;

        warpPositions[i * 6 + 3] = x;
        warpPositions[i * 6 + 4] = y;
        warpPositions[i * 6 + 5] = z - len;

        warpSpeeds[i] = 1.5 + Math.random() * 2.0;
      }
      warpGeo.setAttribute('position', new THREE.BufferAttribute(warpPositions, 3));
      const warpMat = new THREE.LineBasicMaterial({
        color: 0x55d5ff,
        transparent: true,
        opacity: 0.90,
        blending: THREE.AdditiveBlending,
        fog: false
      });
      const warpLines = new THREE.LineSegments(warpGeo, warpMat);
      warpSubGroup.add(warpLines);

      warpSubGroup.visible = false;
      envGroup.add(warpSubGroup);
    }
    initWarpEnvironment();

    // Chuyển đổi môi trường
    function switchEnvironment(mode) {
      currentEnvMode = mode;
      nebulaSubGroup.visible = (mode === 'nebula');
      orbitSubGroup.visible = (mode === 'orbit');
      warpSubGroup.visible = (mode === 'warp');

      document.getElementById('btn-env-nebula').classList.toggle('active', mode === 'nebula');
      document.getElementById('btn-env-orbit').classList.toggle('active', mode === 'orbit');
      document.getElementById('btn-env-warp').classList.toggle('active', mode === 'warp');

      if (mode === 'nebula') {
        rimLightCyan.color.setHex(0x00f0ff);
        rimLightMagenta.color.setHex(0xff0088);
        rimLightCyan.intensity = 3.8;
      } else if (mode === 'orbit') {
        rimLightCyan.color.setHex(0x66e0ff);
        rimLightMagenta.color.setHex(0x0055ff);
        rimLightCyan.intensity = 4.5;
      } else if (mode === 'warp') {
        rimLightCyan.color.setHex(0xaaffff);
        rimLightMagenta.color.setHex(0xbb55ff);
        rimLightCyan.intensity = 5.2;
      }
    }

    // ==========================================
    // 7. HOLOGRAM HUD 3D NỔI HAI BÊN SƯỜN
    // ==========================================
    const holoCanvas1 = document.createElement('canvas');
    holoCanvas1.width = 512;
    holoCanvas1.height = 340;
    const holoCtx1 = holoCanvas1.getContext('2d');
    const holoTex1 = new THREE.CanvasTexture(holoCanvas1);

    function drawHolo1(time) {
      holoCtx1.clearRect(0, 0, 512, 340);
      holoCtx1.fillStyle = 'rgba(0, 24, 45, 0.45)';
      holoCtx1.fillRect(0, 0, 512, 340);
      holoCtx1.strokeStyle = 'rgba(0, 229, 255, 0.8)';
      holoCtx1.lineWidth = 3;
      holoCtx1.strokeRect(4, 4, 504, 332);

      holoCtx1.fillStyle = '#00ffea';
      holoCtx1.font = 'bold 22px monospace';
      holoCtx1.fillText('WARP ENGINE // TELEMETRY', 20, 36);

      holoCtx1.strokeStyle = '#7df9ff';
      holoCtx1.lineWidth = 2.5;
      holoCtx1.beginPath();
      for (let x = 20; x < 490; x += 4) {
        const y = 140 + Math.sin((x * 0.035) + (time * 4)) * 35 + Math.cos((x * 0.015) - time) * 15;
        if (x === 20) holoCtx1.moveTo(x, y);
        else holoCtx1.lineTo(x, y);
      }
      holoCtx1.stroke();

      holoCtx1.fillStyle = '#00e5ff';
      holoCtx1.font = '16px monospace';
      holoCtx1.fillText('WARP CORE: 99.9% STABLE', 20, 230);
      holoCtx1.fillText('QUANTUM LATENCY: 6ms', 20, 260);
      holoCtx1.fillText('DEFENSE SHIELD: 100% ONLINE', 20, 290);
      holoTex1.needsUpdate = true;
    }

    const holoPlaneGeo = new THREE.PlaneGeometry(0.85, 0.58);
    const holoMat1 = new THREE.MeshBasicMaterial({
      map: holoTex1,
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      fog: false
    });
    const holoMesh1 = new THREE.Mesh(holoPlaneGeo, holoMat1);
    holoMesh1.position.set(-1.15, 1.45, 0.25);
    holoMesh1.rotation.y = 0.48;
    scene.add(holoMesh1);

    // ==========================================
    // 8. TẢI MÔ HÌNH NHÂN VẬT 3D TIỂU BẢO BẢO
    // ==========================================
    let characterModel = null;
    let chestBone = null;
    const loader = new THREE.GLTFLoader();

    loader.load(
      'https://appassets.androidplatform.net/assets/models/character_female.glb',
      function (gltf) {
        characterModel = gltf.scene;

        // Căn chỉnh nhân vật đứng trên bệ trung tâm, mặt hướng thẳng về người dùng
        characterModel.position.set(0, 0.18, 0);
        characterModel.scale.set(1.0, 1.0, 1.0);
        characterModel.rotation.y = Math.PI;

        characterModel.traverse(function (node) {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) {
              const mName = (node.material.name || '').toLowerCase();
              if (mName.includes('hair') || mName.includes('toc')) {
                node.material.color = new THREE.Color(0x18181e);
              }
              node.material.roughness = Math.min(node.material.roughness || 0.5, 0.65);
            }
          }
          if (node.isBone) {
            // Hạ cánh tay từ T-pose sang dáng đứng tự nhiên
            if (node.name === 'J_Bip_L_UpperArm') {
              node.rotation.z = 1.25;
              node.rotation.x = -0.15;
              node.rotation.y = 0.12;
            }
            if (node.name === 'J_Bip_R_UpperArm') {
              node.rotation.z = -1.25;
              node.rotation.x = -0.15;
              node.rotation.y = -0.12;
            }
            if (node.name === 'J_Bip_L_LowerArm') {
              node.rotation.z = 0.15;
            }
            if (node.name === 'J_Bip_R_LowerArm') {
              node.rotation.z = -0.15;
            }
            if (node.name === 'J_Bip_C_Chest') {
              chestBone = node;
            }
          }
        });

        scene.add(characterModel);

        const overlay = document.getElementById('loading-overlay');
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 500);
      },
      undefined,
      function (err) {
        console.warn('Fallback loading procedure:', err);
        const overlay = document.getElementById('loading-overlay');
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 500);
      }
    );

    // ==========================================
    // 9. HỆ THỐNG ĐIỀU KHIỂN & ĐỒNG BỘ ĐA KÊNH
    // ==========================================
    const rotSlider = document.getElementById('rot-slider');
    const angleDisplay = document.getElementById('angle-display');
    const zoomSlider = document.getElementById('zoom-slider');
    const zoomDisplay = document.getElementById('zoom-display');

    // Dynamic Auto-Framing: Khi cự ly gần -> ngắm mặt; khi xa -> ngắm ngực
    function calcFramedTargetY(dist) {
      const t = Math.min(Math.max((dist - 1.25) / (3.5 - 1.25), 0), 1);
      return THREE.MathUtils.lerp(1.36, 1.15, t);
    }

    // [Kênh Slider]: Kéo xoay 360°
    rotSlider.addEventListener('input', function () {
      const deg = parseFloat(this.value);
      angleDisplay.innerText = `${Math.round(deg)}°`;
      controls.autoRotate = false;

      const rad = deg * (Math.PI / 180);
      const dx = camera.position.x - controls.target.x;
      const dz = camera.position.z - controls.target.z;
      const horizDist = Math.max(Math.sqrt(dx * dx + dz * dz), 0.1);

      camera.position.x = controls.target.x + horizDist * Math.sin(rad);
      camera.position.z = controls.target.z + horizDist * Math.cos(rad);
      controls.update();
    });

    // [Kênh Slider]: Kéo thu phóng cự ly
    zoomSlider.addEventListener('input', function () {
      const targetDist = parseFloat(this.value);
      zoomDisplay.innerText = `${targetDist.toFixed(1)}m`;
      controls.autoRotate = false;

      // Cập nhật tâm ngắm theo cự ly
      controls.target.y = calcFramedTargetY(targetDist);

      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const currentDist = offset.length();
      if (currentDist > 0.001) {
        offset.multiplyScalar(targetDist / currentDist);
        camera.position.copy(controls.target).add(offset);
        controls.update();
      }
    });

    // [Đồng bộ 2 chiều]: Cập nhật khi xoay hoặc pinch
    controls.addEventListener('change', function () {
      // Đồng bộ slider xoay
      let angle = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z) * (180 / Math.PI);
      if (angle < 0) angle += 360;
      rotSlider.value = Math.round(angle);
      angleDisplay.innerText = `${Math.round(angle)}°`;

      // Đồng bộ slider khoảng cách & auto-frame target Y
      const dist = camera.position.distanceTo(controls.target);
      zoomSlider.value = dist.toFixed(2);
      zoomDisplay.innerText = `${dist.toFixed(1)}m`;
      controls.target.y = calcFramedTargetY(dist);
    });

    // [Cinematic Lerp]: Hiệu ứng chuyển động mượt mà cho Preset Zoom
    let zoomAnimId = null;
    function animateZoomTo(targetDist, customTargetY = null, duration = 380) {
      if (zoomAnimId) cancelAnimationFrame(zoomAnimId);
      controls.autoRotate = false;

      const finalTargetY = (customTargetY !== null) ? customTargetY : calcFramedTargetY(targetDist);
      const startTarget = controls.target.clone();
      const endTarget = new THREE.Vector3(controls.target.x, finalTargetY, controls.target.z);

      const startCam = camera.position.clone();
      const offset = new THREE.Vector3().subVectors(startCam, startTarget);
      const currentDist = offset.length();
      if (currentDist < 0.001) return;

      const endCam = endTarget.clone().add(offset.clone().multiplyScalar(targetDist / currentDist));
      const startTime = performance.now();

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);

        controls.target.lerpVectors(startTarget, endTarget, ease);
        camera.position.lerpVectors(startCam, endCam, ease);
        controls.update();

        if (progress < 1) {
          zoomAnimId = requestAnimationFrame(step);
        } else {
          zoomAnimId = null;
        }
      }
      zoomAnimId = requestAnimationFrame(step);
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
    }

    function setAngle(deg) {
      controls.autoRotate = false;
      rotSlider.value = deg;
      angleDisplay.innerText = `${deg}°`;
      const rad = deg * (Math.PI / 180);
      const dx = camera.position.x - controls.target.x;
      const dz = camera.position.z - controls.target.z;
      const horizDist = Math.max(Math.sqrt(dx * dx + dz * dz), 0.1);

      camera.position.x = controls.target.x + horizDist * Math.sin(rad);
      camera.position.z = controls.target.z + horizDist * Math.cos(rad);
      controls.update();
    }

    // ==========================================
    // BIND SỰ KIỆN CẢM ỨNG ĐA TẦNG CHO CÁC NÚT (POINTERDOWN + TOUCHEND + CLICK)
    // ==========================================
    function bindPress(id, actionFn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        actionFn();
      });
      el.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    }

    bindPress('btn-env-nebula', () => switchEnvironment('nebula'));
    bindPress('btn-env-orbit', () => switchEnvironment('orbit'));
    bindPress('btn-env-warp', () => switchEnvironment('warp'));

    bindPress('btn-auto-rot', () => toggleAutoRotate());
    bindPress('btn-front', () => setAngle(0));
    bindPress('btn-back', () => setAngle(180));
    bindPress('btn-zoom-in', () => animateZoomTo(1.45, 1.36));
    bindPress('btn-zoom-out', () => animateZoomTo(3.2, 1.15));

    // ==========================================
    // 10. VÒNG LẶP RENDER 60 FPS & ANIMATIONS
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const delta = clock.getDelta();

      controls.update();

      // Cập nhật Hologram sườn tàu
      drawHolo1(elapsed);

      // Animation môi trường không gian
      if (currentEnvMode === 'nebula') {
        nebulaSubGroup.rotation.y = elapsed * 0.008;
      } else if (currentEnvMode === 'orbit') {
        if (planetMesh) planetMesh.rotation.y = elapsed * 0.025;
        if (asteroidBelt) asteroidBelt.rotation.y = elapsed * 0.045;
      } else if (currentEnvMode === 'warp') {
        const pos = warpGeo.attributes.position.array;
        for (let i = 0; i < warpCount; i++) {
          const spd = warpSpeeds[i];
          pos[i * 6 + 2] += spd * 42 * delta;
          pos[i * 6 + 5] += spd * 42 * delta;

          if (pos[i * 6 + 2] > 20) {
            const x = (Math.random() - 0.5) * 70;
            const y = (Math.random() - 0.5) * 70;
            const z = -150 - Math.random() * 20;
            const len = 4.0 + Math.random() * 6.5;

            pos[i * 6] = x;
            pos[i * 6 + 1] = y;
            pos[i * 6 + 2] = z;

            pos[i * 6 + 3] = x;
            pos[i * 6 + 4] = y;
            pos[i * 6 + 5] = z - len;
          }
        }
        warpGeo.attributes.position.needsUpdate = true;

        // Micro Warp Rumble
        camera.position.x += (Math.random() - 0.5) * 0.002;
        camera.position.y += (Math.random() - 0.5) * 0.002;
      }

      // Nhịp xung năng lượng LED sàn tàu
      const pulse = 0.5 + 0.5 * Math.sin(elapsed * 2.8);
      matNeonCyan.emissiveIntensity = 2.6 + 0.8 * pulse;
      floorGlowLight.intensity = 2.2 + 0.8 * pulse;

      // Nhịp thở sinh học lồng ngực nhân vật
      if (chestBone) {
        chestBone.rotation.x = 0.022 * Math.sin(elapsed * 2.0);
      }

      renderer.render(scene, camera);
    }

    animate();

    // Responsive Canvas Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    });
  </script>
</body>
</html>
