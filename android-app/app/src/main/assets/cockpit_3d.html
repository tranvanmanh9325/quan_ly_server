<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sci-Fi Command Bridge - Tieu Bao Bao</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010206;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* HUD Header tối giản phong cách chiến hạm */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      background: rgba(1, 4, 12, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.28);
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(56, 189, 248, 0.12);
      transition: opacity 0.6s ease;
    }
    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8, 0 0 16px rgba(56, 189, 248, 0.7);
      animation: pulseDot 2.2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .hud-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: #e0f2fe;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* HUD Footer chuyển đổi môi trường siêu tối giản */
    .env-selector-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(1, 5, 14, 0.70);
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
      opacity: 0.40;
      transition: opacity 0.4s ease, transform 0.3s ease;
    }
    .env-selector-container:hover,
    .env-selector-container.active-state {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
    .env-dot-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.22s ease;
      touch-action: manipulation;
    }
    .env-dot-btn .btn-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #475569;
      transition: all 0.22s ease;
    }
    .env-dot-btn.active {
      color: #f0f9ff;
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.40);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .env-dot-btn.active .btn-indicator {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8, 0 0 14px rgba(56, 189, 248, 0.8);
    }

    /* Mẹo chỉ dẫn cử chỉ mờ */
    .gesture-hint {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
      pointer-events: none;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.50);
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.6s ease;
    }
  </style>
  <!-- Three.js tải offline trực tiếp qua WebViewAssetLoader -->
  <script src="https://appassets.androidplatform.net/assets/js/three.min.js"></script>
  <script src="https://appassets.androidplatform.net/assets/js/OrbitControls.js"></script>
  <script src="https://appassets.androidplatform.net/assets/js/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-header" id="hud-header">
    <div class="hud-dot"></div>
    <div class="hud-title">COMMAND BRIDGE // OBSERVATION DECK</div>
  </div>

  <div class="gesture-hint" id="gesture-hint">
    Vuốt để xoay 360° • Chụm hoặc Chạm 2 lần để Thu Phóng
  </div>

  <div class="env-selector-container active-state" id="env-selector">
    <button class="env-dot-btn active" id="btn-env-orbit" data-mode="orbit">
      <div class="btn-indicator"></div>
      <span>Hành Tinh</span>
    </button>
    <button class="env-dot-btn" id="btn-env-nebula" data-mode="nebula">
      <div class="btn-indicator"></div>
      <span>Tinh Vân</span>
    </button>
    <button class="env-dot-btn" id="btn-env-warp" data-mode="warp">
      <div class="btn-indicator"></div>
      <span>Siêu Không Gian</span>
    </button>
  </div>

  <script>
    // ==========================================
    // 1. KHỞI TẠO THREE.JS ENGINE CHUẨN ĐIỆN ẢNH
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010206);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const DEFAULT_CAM_POS = new THREE.Vector3(0.0, 1.25, 2.50);
    const DEFAULT_TARGET = new THREE.Vector3(0.0, 0.95, 0.0);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // ==========================================
    // 2. ORBIT CONTROLS TỐI ƯU CẢM ỨNG & THU PHÓNG SIÊU NHẠY
    // ==========================================
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.copy(DEFAULT_TARGET);

    // Phạm vi thu phóng cực rộng: từ cực cận mặt (0.75m) đến toàn cảnh buồng lái và vũ trụ (14.0m)
    controls.minDistance = 0.75;
    controls.maxDistance = 14.0;
    controls.minPolarAngle = Math.PI * 0.10;
    controls.maxPolarAngle = Math.PI * 0.90;
    controls.zoomSpeed = 2.4;
    controls.rotateSpeed = 0.85;

    // Tự động xoay quanh buồng lái điện ảnh
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.45;

    // ==========================================
    // 3. HỆ THỐNG ÁNH SÁNG CHIẾN HẠM VŨ TRỤ (CINEMATIC 5-POINT LIGHTING)
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0x0a1424, 0.95);
    scene.add(ambientLight);

    // Key Light chính diện dịu nhẹ chiếu vào nhân vật
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.25);
    keyLight.position.set(1.5, 3.2, 2.8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    scene.add(keyLight);

    // Fill Light màu xanh lơ từ mạn trái bù sáng
    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.85);
    fillLight.position.set(-2.5, 1.8, 1.8);
    scene.add(fillLight);

    // Cosmic Rim Light từ phía sau lưng xuyên qua vòm kính
    const rimLightCosmic = new THREE.SpotLight(0x60a5fa, 1.45, 40, Math.PI / 4, 0.4);
    rimLightCosmic.position.set(0, 3.2, -4.5);
    rimLightCosmic.target.position.set(0, 1.1, 0);
    scene.add(rimLightCosmic);
    scene.add(rimLightCosmic.target);

    // Accent Rim Magenta từ mạn phải phía sau
    const rimPointMagenta = new THREE.PointLight(0xd946ef, 0.65, 12);
    rimPointMagenta.position.set(2.2, 1.4, -2.5);
    scene.add(rimPointMagenta);

    // ==========================================
    // 4. VẬT LIỆU CAO CẤP HỢP KIM TITAN & CARBON FIBER
    // ==========================================
    const matDeckPlates = new THREE.MeshStandardMaterial({
      color: 0x060c18,
      metalness: 0.82,
      roughness: 0.38
    });

    const matDais = new THREE.MeshStandardMaterial({
      color: 0x0b1626,
      metalness: 0.65,
      roughness: 0.30
    });

    const matStructural = new THREE.MeshStandardMaterial({
      color: 0x050a14,
      metalness: 0.90,
      roughness: 0.25
    });

    const matCyanGlow = new THREE.MeshStandardMaterial({
      color: 0x0284c7,
      emissive: 0x38bdf8,
      emissiveIntensity: 1.15,
      roughness: 0.1
    });

    // ==========================================
    // 5. KIẾN TRÚC BUỒNG LÁI TÀU VŨ TRỤ PORTRAIT ĐIỆN ẢNH
    // BỆ BÁT GIÁC 2 TẦNG & KHUNG VÒM BUỒNG LÁI 3D KHÔNG CHẮN TẦM NHÌN
    // ==========================================
    const bridgeGroup = new THREE.Group();
    bridgeGroup.name = 'bridgeGroup';

    // 5.1. Bệ đứng chỉ huy 2 tầng hình bát giác (Octagonal Command Dais)
    function buildBridgePlatform() {
      const group = new THREE.Group();

      // Bệ tầng 1 (Đế bát giác hợp kim titan)
      const baseGeo = new THREE.CylinderGeometry(1.08, 1.18, 0.08, 8);
      const base = new THREE.Mesh(baseGeo, matDeckPlates);
      base.position.y = 0.04;
      base.receiveShadow = true;
      group.add(base);

      // Bệ tầng 2 (Mặt bệ carbon composite đứng của chỉ huy)
      const daisGeo = new THREE.CylinderGeometry(0.96, 1.04, 0.07, 8);
      const dais = new THREE.Mesh(daisGeo, matDais);
      dais.position.y = 0.095;
      dais.receiveShadow = true;
      group.add(dais);

      // Vòng LED định vị âm sàn mỏng phát quang Cyan
      const ringGeo = new THREE.RingGeometry(0.88, 0.92, 36);
      const ring = new THREE.Mesh(ringGeo, matCyanGlow);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(0, 0.131, 0);
      group.add(ring);

      return group;
    }
    bridgeGroup.add(buildBridgePlatform());

    // 5.2. Khung vòm buồng lái quan sát (Canopy Geodesic Arch Pylons)
    // 4 Cột dầm buồng lái ôm theo 4 góc bệ chỉ huy, không bao giờ che mặt nhân vật khi xoay 360°
    function buildCanopyPylons() {
      const group = new THREE.Group();

      const pylonGeo = new THREE.BoxGeometry(0.06, 4.4, 0.07);
      const ledGeo = new THREE.BoxGeometry(0.010, 4.0, 0.015);

      // 4 Vị trí cột dầm buồng lái ôm quanh bệ bát giác
      const pylonConfigs = [
        { x: -0.82, z: 0.45,  ledOffX: 0.03,  ledOffZ: -0.03 },
        { x: 0.82,  z: 0.45,  ledOffX: -0.03, ledOffZ: -0.03 },
        { x: -0.82, z: -0.55, ledOffX: 0.03,  ledOffZ: 0.03 },
        { x: 0.82,  z: -0.55, ledOffX: -0.03, ledOffZ: 0.03 }
      ];

      pylonConfigs.forEach(cfg => {
        const pylon = new THREE.Mesh(pylonGeo, matStructural);
        pylon.position.set(cfg.x, 2.0, cfg.z);
        pylon.castShadow = true;
        group.add(pylon);

        const led = new THREE.Mesh(ledGeo, matCyanGlow);
        led.position.set(cfg.x + cfg.ledOffX, 2.0, cfg.z + cfg.ledOffZ);
        group.add(led);
      });

      // Dầm nóc vòm ngang trước (Y = 2.45m)
      const frontArchGeo = new THREE.BoxGeometry(1.70, 0.08, 0.08);
      const frontArch = new THREE.Mesh(frontArchGeo, matStructural);
      frontArch.position.set(0, 2.45, 0.45);
      group.add(frontArch);

      const frontArchLed = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.012, 0.015), matCyanGlow);
      frontArchLed.position.set(0, 2.39, 0.45);
      group.add(frontArchLed);

      // Dầm nóc vòm ngang sau (Y = 2.45m)
      const rearArchGeo = new THREE.BoxGeometry(1.70, 0.08, 0.08);
      const rearArch = new THREE.Mesh(rearArchGeo, matStructural);
      rearArch.position.set(0, 2.45, -0.55);
      group.add(rearArch);

      // 2 Dầm dọc nóc buồng lái nối trước - sau (Longitudinal Canopy Rails)
      const railGeo = new THREE.BoxGeometry(0.06, 0.06, 1.05);
      const leftRail = new THREE.Mesh(railGeo, matStructural);
      leftRail.position.set(-0.82, 2.45, -0.05);
      group.add(leftRail);

      const rightRail = new THREE.Mesh(railGeo, matStructural);
      rightRail.position.set(0.82, 2.45, -0.05);
      group.add(rightRail);

      return group;
    }
    bridgeGroup.add(buildCanopyPylons());

    // 5.3. Màn hình Hologram ba chiều lơ lửng (True Floating Holo-HUD)
    function createHoloHUD(title, subtitle, lines, xPos, zPos, rotY) {
      const group = new THREE.Group();

      const holoCanvas = document.createElement('canvas');
      holoCanvas.width = 512;
      holoCanvas.height = 320;
      const ctx = holoCanvas.getContext('2d');

      function drawContent() {
        ctx.clearRect(0, 0, 512, 320);

        // Khung nền Hologram thủy tinh mờ công nghệ cao
        ctx.fillStyle = 'rgba(2, 16, 36, 0.55)';
        ctx.fillRect(8, 8, 496, 304);

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.75)';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(8, 8, 496, 304);

        // 4 Góc ngắm Tactical Reticle Corners
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        const corner = 22;
        ctx.beginPath();
        ctx.moveTo(8, 8 + corner); ctx.lineTo(8, 8); ctx.lineTo(8 + corner, 8);
        ctx.moveTo(504 - corner, 8); ctx.lineTo(504, 8); ctx.lineTo(504, 8 + corner);
        ctx.moveTo(8, 312 - corner); ctx.lineTo(8, 312); ctx.lineTo(8 + corner, 312);
        ctx.moveTo(504 - corner, 312); ctx.lineTo(504, 312); ctx.lineTo(504, 312 - corner);
        ctx.stroke();

        // Tiêu đề Hologram
        ctx.font = 'bold 19px monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(title, 24, 40);

        ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.fillRect(24, 48, 464, 1.5);

        // Nội dung hiển thị
        ctx.font = '14px monospace';
        ctx.fillStyle = '#bae6fd';
        lines.forEach((line, idx) => {
          ctx.fillText(line, 24, 78 + idx * 24);
        });

        // Đồ thị động hoặc Radar quét sóng
        const now = Date.now() * 0.003;
        if (title.indexOf('PROPULSION') !== -1) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let px = 0; px < 464; px += 4) {
            const py = 210 + Math.sin(px * 0.05 + now * 2) * 16 + Math.cos(px * 0.02 + now) * 8;
            if (px === 0) ctx.moveTo(24 + px, py);
            else ctx.lineTo(24 + px, py);
          }
          ctx.stroke();
        } else {
          // Radar tròn với kim quét 360 độ
          const rcx = 100, rcy = 210, rrad = 34;
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
          ctx.beginPath();
          ctx.arc(rcx, rcy, rrad, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(rcx, rcy);
          ctx.lineTo(rcx + Math.cos(now * 1.5) * rrad, rcy + Math.sin(now * 1.5) * rrad);
          ctx.stroke();

          ctx.font = '12px monospace';
          ctx.fillStyle = '#7dd3fc';
          ctx.fillText('SENSOR SWEEP: ACTIVE', 155, 195);
          ctx.fillText('ZOOM: 0.75 - 14.0 AU', 155, 215);
          ctx.fillText('DIRECTOR: 360° AUTO', 155, 235);
        }

        ctx.font = '11px monospace';
        ctx.fillStyle = 'rgba(56, 189, 248, 0.65)';
        ctx.fillText('DEFENSE MATRIX: OPTIMAL', 24, 275);
        ctx.fillText('COMM SECURE: ENCRYPTED', 24, 293);
      }

      drawContent();
      const holoTex = new THREE.CanvasTexture(holoCanvas);

      // Mặt phẳng chiếu Hologram lơ lửng không gian
      const planeGeo = new THREE.PlaneGeometry(0.68, 0.42);
      const planeMat = new THREE.MeshBasicMaterial({
        map: holoTex,
        transparent: true,
        opacity: 0.88,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const planeMesh = new THREE.Mesh(planeGeo, planeMat);
      planeMesh.position.set(xPos, 1.05, zPos);
      planeMesh.rotation.y = rotY;
      group.add(planeMesh);

      return {
        group,
        planeMesh,
        update: function (time) {
          drawContent();
          holoTex.needsUpdate = true;
          // Hiệu ứng bồng bềnh lơ lửng tự nhiên
          planeMesh.position.y = 1.05 + Math.sin(time * 1.6 + (xPos > 0 ? 1.0 : 0)) * 0.025;
        }
      };
    }

    // Đặt 2 Hologram lơ lửng hai bên sườn (X = ±0.60m) ôm trọn khung hình Portrait
    const leftHolo = createHoloHUD(
      'PROPULSION // DIAGNOSTICS',
      'CORE STATUS',
      [
        'WARP CORE: 99.98% STABLE',
        'ION FREQUENCY: 432.8 THz',
        'QUANTUM RESERVE: 100% ONLINE',
        'THERMAL EXHAUST: NOMINAL'
      ],
      -0.60, 0.15, 0.38
    );

    const rightHolo = createHoloHUD(
      'STELLAR NAVIGATION // TELEMETRY',
      'GRID MAP',
      [
        'SECTOR: CYGNUS-ALPHA',
        'TARGET: SOL // EARTH',
        'LIGHT CONE: ALIGNED',
        'WARP DRIVE: ARMED'
      ],
      0.60, 0.15, -0.38
    );

    bridgeGroup.add(leftHolo.group);
    bridgeGroup.add(rightHolo.group);
    scene.add(bridgeGroup);

    // ==========================================
    // 6. HỆ THỐNG VŨ TRỤ ĐA TẦNG (3 CHẾ ĐỘ MÔI TRƯỜNG)
    // ==========================================
    const envGroup = new THREE.Group();
    scene.add(envGroup);

    // BẦU TRỜ SAO SÂU THẲM CHUNG CHO TOÀN BỘ VŨ TRỤ (3200 STARS)
    const starGeo = new THREE.BufferGeometry();
    const starCount = 3200;
    const starPos = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      const rad = 50 + Math.random() * 220;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);

      starPos[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
      starPos[i * 3 + 2] = rad * Math.cos(phi);

      const rnd = Math.random();
      if (rnd > 0.82) {
        starColors[i * 3] = 0.55; starColors[i * 3 + 1] = 0.85; starColors[i * 3 + 2] = 1.0; // Cyan Blue
      } else if (rnd > 0.65) {
        starColors[i * 3] = 1.0;  starColors[i * 3 + 1] = 0.88; starColors[i * 3 + 2] = 0.65; // Amber
      } else if (rnd > 0.50) {
        starColors[i * 3] = 0.95; starColors[i * 3 + 1] = 0.60; starColors[i * 3 + 2] = 0.80; // Violet
      } else {
        starColors[i * 3] = 0.95; starColors[i * 3 + 1] = 0.98; starColors[i * 3 + 2] = 1.0; // Pure White
      }
    }

    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

    const starMat = new THREE.PointsMaterial({
      size: 0.40,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      fog: false
    });
    const starField = new THREE.Points(starGeo, starMat);
    envGroup.add(starField);

    // --- CHẾ ĐỘ 1: PLANETARY ORBIT (QUỸ ĐẠO SIÊU HÀNH TINH KHỔNG LỒ) - MẶC ĐỊNH ---
    const orbitSubGroup = new THREE.Group();
    let planetMesh = null;
    let planetaryRings = null;

    function initOrbitSystem() {
      // Siêu hành tinh khí khổng lồ với vân mây mềm mại & bóng đổ bán cầu 3D
      const pGeo = new THREE.SphereGeometry(16, 64, 32);
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 1024;
      pCanvas.height = 512;
      const pCtx = pCanvas.getContext('2d');

      const pGrad = pCtx.createLinearGradient(0, 0, 0, 512);
      pGrad.addColorStop(0, '#031428');
      pGrad.addColorStop(0.30, '#062e50');
      pGrad.addColorStop(0.50, '#0a4978');
      pGrad.addColorStop(0.70, '#062947');
      pGrad.addColorStop(1, '#021020');
      pCtx.fillStyle = pGrad;
      pCtx.fillRect(0, 0, 1024, 512);

      // Các dải vân mây khí quyển hành tinh
      pCtx.fillStyle = 'rgba(56, 189, 248, 0.30)';
      for (let i = 0; i < 14; i++) {
        pCtx.fillRect(0, 40 + i * 32, 1024, 12);
      }
      pCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      for (let i = 0; i < 8; i++) {
        pCtx.fillRect(0, 60 + i * 55, 1024, 6);
      }

      // Bóng đổ bán cầu (Terminator Shadow) tạo chiều sâu 3D hình cầu nổi
      const shadowGrad = pCtx.createLinearGradient(0, 0, 1024, 0);
      shadowGrad.addColorStop(0, 'rgba(0, 4, 10, 0.85)');
      shadowGrad.addColorStop(0.40, 'rgba(0, 6, 16, 0.40)');
      shadowGrad.addColorStop(0.75, 'rgba(0, 0, 0, 0)');
      shadowGrad.addColorStop(1, 'rgba(0, 4, 10, 0.85)');
      pCtx.fillStyle = shadowGrad;
      pCtx.fillRect(0, 0, 1024, 512);

      const pMat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(pCanvas),
        fog: false
      });
      planetMesh = new THREE.Mesh(pGeo, pMat);
      // Đặt hành tinh ở phía sau lưng nhân vật (-Z) để nhìn thấy qua vòm kính buồng lái
      planetMesh.position.set(2.8, 3.8, -38.0);
      orbitSubGroup.add(planetMesh);

      // Vầng hào quang khí quyển
      const atmoGeo = new THREE.SphereGeometry(16.4, 64, 32);
      const atmoMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.35,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        fog: false
      });
      const atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
      atmoMesh.position.copy(planetMesh.position);
      orbitSubGroup.add(atmoMesh);

      // Vành đai thiên thạch băng xoay nghiêng
      const ringGeo = new THREE.RingGeometry(18.5, 28.0, 64);
      const rCanvas = document.createElement('canvas');
      rCanvas.width = 512;
      rCanvas.height = 64;
      const rCtx = rCanvas.getContext('2d');
      const rGrad = rCtx.createLinearGradient(0, 0, 512, 0);
      rGrad.addColorStop(0, 'rgba(56, 189, 248, 0)');
      rGrad.addColorStop(0.20, 'rgba(186, 230, 253, 0.65)');
      rGrad.addColorStop(0.50, 'rgba(56, 189, 248, 0.35)');
      rGrad.addColorStop(0.80, 'rgba(125, 211, 252, 0.70)');
      rGrad.addColorStop(1, 'rgba(2, 132, 199, 0)');
      rCtx.fillStyle = rGrad;
      rCtx.fillRect(0, 0, 512, 64);

      const ringMat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(rCanvas),
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        fog: false
      });
      planetaryRings = new THREE.Mesh(ringGeo, ringMat);
      planetaryRings.position.copy(planetMesh.position);
      planetaryRings.rotation.x = Math.PI * 0.42;
      planetaryRings.rotation.y = Math.PI * 0.15;
      orbitSubGroup.add(planetaryRings);

      orbitSubGroup.visible = true; // Mặc định hiển thị Quỹ đạo hành tinh
      envGroup.add(orbitSubGroup);
    }
    initOrbitSystem();

    // --- CHẾ ĐỘ 2: COSMIC NEBULA (TINH VÂN VŨ TRỤ HUYỀN ẢO) ---
    const nebulaSubGroup = new THREE.Group();
    function initNebulaSystem() {
      const nebCanvas = document.createElement('canvas');
      nebCanvas.width = 2048;
      nebCanvas.height = 1024;
      const ctx = nebCanvas.getContext('2d');

      // Nền đen sâu thẳm vũ trụ 100%
      ctx.fillStyle = '#010206';
      ctx.fillRect(0, 0, 2048, 1024);

      function drawNebulaCloud(cx, cy, radius, r, g, b, alpha) {
        const radGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        radGrad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')');
        radGrad.addColorStop(0.40, 'rgba(' + r + ',' + g + ',' + b + ',' + (alpha * 0.35) + ')');
        radGrad.addColorStop(1, 'rgba(1, 2, 6, 0)');
        ctx.fillStyle = radGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Chỉ vẽ các dải mây tinh vân ở bán cầu trên (Y = 150 - 380)
      drawNebulaCloud(620, 280, 360, 2, 132, 199, 0.28);
      drawNebulaCloud(1420, 250, 380, 147, 51, 234, 0.25);
      drawNebulaCloud(1024, 200, 320, 14, 165, 233, 0.22);
      drawNebulaCloud(400, 320, 260, 217, 70, 239, 0.18);
      drawNebulaCloud(1680, 300, 280, 6, 182, 212, 0.22);

      // Đảm bảo 100% nửa dưới chân trời đen tuyền không tì vết
      ctx.fillStyle = '#010206';
      ctx.fillRect(0, 512, 2048, 512);

      const nebTexture = new THREE.CanvasTexture(nebCanvas);
      const skyDomeGeo = new THREE.SphereGeometry(260, 48, 24);
      const skyDomeMat = new THREE.MeshBasicMaterial({
        map: nebTexture,
        side: THREE.BackSide,
        fog: false
      });
      const skyDome = new THREE.Mesh(skyDomeGeo, skyDomeMat);
      nebulaSubGroup.add(skyDome);

      nebulaSubGroup.visible = false;
      envGroup.add(nebulaSubGroup);
    }
    initNebulaSystem();

    // --- CHẾ ĐỘ 3: HYPERSPACE WARP JUMP (BƯỚC NHẢY SIÊU KHÔNG GIAN) ---
    const warpSubGroup = new THREE.Group();
    const warpCount = 650;
    const warpGeo = new THREE.BufferGeometry();
    const warpPos = new Float32Array(warpCount * 6);
    const warpSpeeds = new Float32Array(warpCount);

    for (let i = 0; i < warpCount; i++) {
      const x = (Math.random() - 0.5) * 95;
      const y = (Math.random() - 0.5) * 95;
      const z = -180 + Math.random() * 200;
      const len = 5.0 + Math.random() * 9.0;

      warpPos[i * 6] = x;
      warpPos[i * 6 + 1] = y;
      warpPos[i * 6 + 2] = z;

      warpPos[i * 6 + 3] = x;
      warpPos[i * 6 + 4] = y;
      warpPos[i * 6 + 5] = z - len;

      warpSpeeds[i] = 1.2 + Math.random() * 1.8;
    }

    warpGeo.setAttribute('position', new THREE.BufferAttribute(warpPos, 3));
    const warpMat = new THREE.LineBasicMaterial({
      color: 0x67e8f9,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      fog: false
    });
    const warpLines = new THREE.LineSegments(warpGeo, warpMat);
    warpSubGroup.add(warpLines);
    warpSubGroup.visible = false;
    envGroup.add(warpSubGroup);

    let currentEnvMode = 'orbit';

    // Hàm chuyển đổi môi trường mượt mà
    function switchEnvironment(mode) {
      currentEnvMode = mode;
      orbitSubGroup.visible = (mode === 'orbit');
      nebulaSubGroup.visible = (mode === 'nebula');
      warpSubGroup.visible = (mode === 'warp');

      document.querySelectorAll('.env-dot-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
      });

      if (mode === 'orbit') {
        rimLightCosmic.color.setHex(0x60a5fa);
        rimLightCosmic.intensity = 1.45;
      } else if (mode === 'nebula') {
        rimLightCosmic.color.setHex(0x38bdf8);
        rimLightCosmic.intensity = 1.15;
      } else if (mode === 'warp') {
        rimLightCosmic.color.setHex(0xa5f3fc);
        rimLightCosmic.intensity = 1.8;
      }
    }

    // ==========================================
    // 7. TẢI MÔ HÌNH NHÂN VẬT TIỂU BẢO BẢO (GLB)
    // ==========================================
    let characterModel = null;
    let chestBone = null;
    const loader = new THREE.GLTFLoader();

    loader.load(
      'https://appassets.androidplatform.net/assets/models/character_female.glb',
      function (gltf) {
        characterModel = gltf.scene;

        // Căn chỉnh nhân vật đứng trên bệ trung tâm, mặt hướng thẳng về người dùng
        characterModel.position.set(0, 0.13, 0);
        characterModel.scale.set(1.0, 1.0, 1.0);
        characterModel.rotation.y = Math.PI;

        characterModel.traverse(function (node) {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) {
              node.material.roughness = 0.45;
              node.material.metalness = 0.15;
            }
          }
          if (node.isBone) {
            // Hạ cánh tay từ T-pose sang dáng đứng tự nhiên thanh thoát
            if (node.name === 'J_Bip_L_UpperArm') {
              node.rotation.z = 1.25;
              node.rotation.x = -0.15;
              node.rotation.y = 0.12;
            }
            if (node.name === 'J_Bip_R_UpperArm') {
              node.rotation.z = -1.25;
              node.rotation.x = -0.15;
              node.rotation.y = -0.12;
            }
            if (node.name === 'J_Bip_L_LowerArm') {
              node.rotation.z = 0.15;
            }
            if (node.name === 'J_Bip_R_LowerArm') {
              node.rotation.z = -0.15;
            }
            if (node.name === 'J_Bip_C_Chest') {
              chestBone = node;
            }
          }
        });

        scene.add(characterModel);
      },
      undefined,
      function (err) {
        console.warn('Lỗi khi tải mô hình GLB nhân vật:', err);
      }
    );

    // ==========================================
    // 8. DOUBLE-TAP CHUYỂN ĐỔI NHANH CẬN CẢNH / TOÀN CẢNH
    // ==========================================
    let lastTapTime = 0;
    renderer.domElement.addEventListener('pointerup', (e) => {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        toggleQuickZoom();
      }
      lastTapTime = now;
    });

    let isZoomedIn = false;
    function toggleQuickZoom() {
      const targetDist = isZoomedIn ? 2.50 : 1.10;
      isZoomedIn = !isZoomedIn;
      smoothZoomToDistance(targetDist);
    }

    function smoothZoomToDistance(targetDist) {
      const dir = camera.position.clone().sub(controls.target).normalize();
      const startPos = camera.position.clone();
      const endPos = controls.target.clone().add(dir.multiplyScalar(targetDist));

      const startTime = performance.now();
      const duration = 500;

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const ease = progress < 0.5
          ? 2 * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        camera.position.lerpVectors(startPos, endPos, ease);
        controls.update();

        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    // ==========================================
    // 9. HỆ THỐNG ĐẠO DIỄN TỰ ĐỘNG (CINEMATIC AUTO IDLE DIRECTOR)
    // Sau 5s không chạm -> Tự động trở về chính diện & tự xoay 360 độ
    // ==========================================
    const IDLE_TIMEOUT_MS = 5000;
    let idleTimer = null;
    let isAutoGlideActive = false;
    let glideAnimId = null;

    function resetIdleTimer() {
      if (isAutoGlideActive) {
        if (glideAnimId) cancelAnimationFrame(glideAnimId);
        isAutoGlideActive = false;
      }
      controls.autoRotate = false;

      const selector = document.getElementById('env-selector');
      if (selector) selector.classList.add('active-state');

      clearTimeout(idleTimer);
      idleTimer = setTimeout(onIdleTimeout, IDLE_TIMEOUT_MS);
    }

    function onIdleTimeout() {
      const selector = document.getElementById('env-selector');
      if (selector) selector.classList.remove('active-state');

      glideCameraToFront(function () {
        controls.autoRotate = true;
      });
    }

    function glideCameraToFront(callback) {
      if (glideAnimId) cancelAnimationFrame(glideAnimId);
      isAutoGlideActive = true;

      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();

      const endTarget = DEFAULT_TARGET.clone();
      const endPos = DEFAULT_CAM_POS.clone();

      const startTime = performance.now();
      const duration = 1200;

      function step(now) {
        if (!isAutoGlideActive) return;

        const progress = Math.min((now - startTime) / duration, 1);
        const ease = progress < 0.5
          ? 4 * progress * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        camera.position.lerpVectors(startPos, endPos, ease);
        controls.target.lerpVectors(startTarget, endTarget, ease);
        controls.update();

        if (progress < 1) {
          glideAnimId = requestAnimationFrame(step);
        } else {
          isAutoGlideActive = false;
          glideAnimId = null;
          if (callback) callback();
        }
      }

      glideAnimId = requestAnimationFrame(step);
    }

    ['pointerdown', 'pointermove', 'wheel', 'touchstart', 'touchmove'].forEach(evt => {
      window.addEventListener(evt, resetIdleTimer, { passive: true });
    });

    resetIdleTimer();

    // ==========================================
    // 10. BIND NÚT CHUYỂN MÔI TRƯỜNG TỐI GIẢN (HỖ TRỢ CẢ CLICK, TOUCH, POINTER)
    // ==========================================
    document.querySelectorAll('.env-dot-btn').forEach(btn => {
      const handleSwitch = (e) => {
        e.preventDefault();
        e.stopPropagation();
        resetIdleTimer();
        const mode = btn.getAttribute('data-mode');
        switchEnvironment(mode);
      };
      btn.addEventListener('click', handleSwitch);
      btn.addEventListener('pointerdown', handleSwitch);
      btn.addEventListener('touchstart', handleSwitch);
    });

    // ==========================================
    // 11. VÒNG LẶP RENDER 60 FPS & ANIMATIONS ĐIỆN ẢNH
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const delta = clock.getDelta();

      controls.update();

      leftHolo.update(elapsed);
      rightHolo.update(elapsed);

      if (currentEnvMode === 'orbit') {
        if (planetMesh) planetMesh.rotation.y = elapsed * 0.015;
        if (planetaryRings) planetaryRings.rotation.y = elapsed * 0.024;
      } else if (currentEnvMode === 'nebula') {
        nebulaSubGroup.rotation.y = elapsed * 0.005;
      } else if (currentEnvMode === 'warp') {
        const pos = warpGeo.attributes.position.array;
        for (let i = 0; i < warpCount; i++) {
          const spd = warpSpeeds[i];
          pos[i * 6 + 2] += spd * 48 * delta;
          pos[i * 6 + 5] += spd * 48 * delta;

          if (pos[i * 6 + 2] > 25) {
            const x = (Math.random() - 0.5) * 95;
            const y = (Math.random() - 0.5) * 95;
            const z = -180 - Math.random() * 20;
            const len = 5.0 + Math.random() * 9.0;

            pos[i * 6] = x;
            pos[i * 6 + 1] = y;
            pos[i * 6 + 2] = z;

            pos[i * 6 + 3] = x;
            pos[i * 6 + 4] = y;
            pos[i * 6 + 5] = z - len;
          }
        }
        warpGeo.attributes.position.needsUpdate = true;

        camera.position.x += (Math.random() - 0.5) * 0.0015;
        camera.position.y += (Math.random() - 0.5) * 0.0015;
      }

      const pulse = 0.5 + 0.5 * Math.sin(elapsed * 2.2);
      matCyanGlow.emissiveIntensity = 0.95 + 0.35 * pulse;

      if (chestBone) {
        chestBone.rotation.x = 0.022 * Math.sin(elapsed * 2.0);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    });
  </script>
</body>
