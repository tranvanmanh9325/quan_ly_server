<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sci-Fi Planetary Bridge 3D - Tieu Bao Bao</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #01030a;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }

    /* HUD Header tối giản phong cách chiến hạm */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 20px;
      border-radius: 9999px;
      background: rgba(2, 8, 20, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.40);
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 28px rgba(0, 0, 0, 0.8), inset 0 0 14px rgba(56, 189, 248, 0.18);
      transition: opacity 0.6s ease;
    }
    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8, 0 0 16px rgba(56, 189, 248, 0.85);
      animation: pulseDot 2.2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .hud-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e0f2fe;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    /* Mẹo chỉ dẫn cử chỉ */
    .gesture-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
      pointer-events: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(186, 230, 253, 0.70);
      background: rgba(2, 8, 22, 0.72);
      padding: 6px 18px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(12px);
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.6s ease;
    }
  </style>
  <script src="https://appassets.androidplatform.net/assets/js/three.min.js"></script>
  <script src="https://appassets.androidplatform.net/assets/js/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-header" id="hud-header">
    <div class="hud-dot"></div>
    <div class="hud-title">COMMAND BRIDGE // UNITED AI SYSTEM</div>
  </div>

  <div class="gesture-hint" id="gesture-hint">
    Vuốt để xoay 360° • Chụm hoặc Chạm 2 lần để Thu Phóng
  </div>

  <script>
    // =========================================================================
    // 1. KHỞI TẠO THREE.JS ENGINE & THIẾT LẬP CAMERA ĐIỆN ẢNH TOÀN THÂN
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02050e);
    scene.fog = new THREE.FogExp2(0x020817, 0.008);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const DEFAULT_DIST = 2.85;
    const DEFAULT_CAM_Y = 1.02;
    const DEFAULT_TARGET_Y = 0.82;
    let currentDistance = DEFAULT_DIST;
    let targetDistance = DEFAULT_DIST;
    let currentCamY = DEFAULT_CAM_Y;
    let targetCamY = DEFAULT_CAM_Y;
    
    // Góc xoay chuẩn mặt hướng 100% trực diện vào mắt người dùng: Math.PI rad (180 độ)
    const FRONT_FACING_ROTATION_Y = Math.PI;
    let targetRotationY = FRONT_FACING_ROTATION_Y;
    let currentRotationY = FRONT_FACING_ROTATION_Y;

    camera.position.set(0.0, currentCamY, currentDistance);
    const cameraTarget = new THREE.Vector3(0.0, DEFAULT_TARGET_Y, 0.0);
    camera.lookAt(cameraTarget);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // =========================================================================
    // 2. HỆ THỐNG ÁNH SÁNG ĐIỆN ẢNH CHIẾN HẠM (CINEMATIC LIGHTING PIPELINE)
    // =========================================================================
    // 2.1. Ánh sáng môi trường dịu nhẹ xanh thẳm, giữ không gian tối sâu lắng
    const ambientLight = new THREE.AmbientLight(0x0a1628, 0.50);
    scene.add(ambientLight);

    // 2.2. Đèn chiếu rọi tập trung (Ceiling SpotLight) tạo vầng sáng điện ảnh quanh nhân vật
    const ceilingSpot = new THREE.SpotLight(0xe0f2fe, 1.8, 12.0, Math.PI / 4.5, 0.55, 1.0);
    ceilingSpot.position.set(0, 3.6, 0.5);
    ceilingSpot.target.position.set(0, 0.8, 0);
    ceilingSpot.castShadow = true;
    ceilingSpot.shadow.mapSize.width = 1024;
    ceilingSpot.shadow.mapSize.height = 1024;
    ceilingSpot.shadow.bias = -0.001;
    scene.add(ceilingSpot);
    scene.add(ceilingSpot.target);

    // 2.3. Đèn Key Light từ phía trước góc nhìn người dùng chiếu sáng rõ nét khuôn mặt nhân vật
    const frontKeyLight = new THREE.DirectionalLight(0xffffff, 1.15);
    frontKeyLight.position.set(0.3, 1.5, 2.6);
    frontKeyLight.target.position.set(0, 0.95, 0);
    scene.add(frontKeyLight);
    scene.add(frontKeyLight.target);

    // 2.4. Ánh sáng Rim Light xanh ngọc từ siêu hành tinh ngoài cửa sổ hắt vào viền tóc và lưng
    const planetRimLight = new THREE.DirectionalLight(0x38bdf8, 1.6);
    planetRimLight.position.set(0, 1.1, -5.5);
    planetRimLight.target.position.set(0, 0.9, 0);
    scene.add(planetRimLight);
    scene.add(planetRimLight.target);

    // 2.5. Đèn Sun Light ngoài vũ trụ rọi sáng rực rỡ mặt nghiêng của siêu hành tinh
    const cosmicSunLight = new THREE.DirectionalLight(0xffffff, 3.5);
    cosmicSunLight.position.set(14, 10, -10);
    scene.add(cosmicSunLight);

    // 2.6. Đèn hắt dịu nhẹ từ bệ Rune (Floor Uplight)
    const floorRuneLight = new THREE.PointLight(0x38bdf8, 0.25, 2.0);
    floorRuneLight.position.set(0, 0.25, 0);
    scene.add(floorRuneLight);

    // =========================================================================
    // 3. BỘ MÁY SINH TEXTURE PBR ĐIỆN ẢNH PROCEDURAL (ZERO-MB PBR ENGINE)
    // =========================================================================
    function createSciFiPanelMaterial(baseColorHex, roughnessVal, metalnessVal, panelCols, panelRows, withRivets) {
      const size = 512;
      
      const hCanvas = document.createElement('canvas');
      hCanvas.width = size; hCanvas.height = size;
      const hCtx = hCanvas.getContext('2d');
      hCtx.fillStyle = '#808080';
      hCtx.fillRect(0, 0, size, size);

      const aCanvas = document.createElement('canvas');
      aCanvas.width = size; aCanvas.height = size;
      const aCtx = aCanvas.getContext('2d');
      aCtx.fillStyle = baseColorHex;
      aCtx.fillRect(0, 0, size, size);

      const colW = size / panelCols;
      const rowH = size / panelRows;

      hCtx.strokeStyle = '#101010';
      hCtx.lineWidth = 5;
      aCtx.strokeStyle = 'rgba(0, 0, 0, 0.70)';
      aCtx.lineWidth = 3;

      for (let c = 0; c <= panelCols; c++) {
        const x = c * colW;
        hCtx.beginPath(); hCtx.moveTo(x, 0); hCtx.lineTo(x, size); hCtx.stroke();
        aCtx.beginPath(); aCtx.moveTo(x, 0); aCtx.lineTo(x, size); aCtx.stroke();
      }
      for (let r = 0; r <= panelRows; r++) {
        const y = r * rowH;
        hCtx.beginPath(); hCtx.moveTo(0, y); hCtx.lineTo(size, y); hCtx.stroke();
        aCtx.beginPath(); aCtx.moveTo(0, y); aCtx.lineTo(size, y); aCtx.stroke();
      }

      if (withRivets) {
        hCtx.fillStyle = '#ffffff';
        aCtx.fillStyle = '#38bdf8';
        for (let c = 0; c < panelCols; c++) {
          for (let r = 0; r < panelRows; r++) {
            const x0 = c * colW + 14, x1 = (c + 1) * colW - 14;
            const y0 = r * rowH + 14, y1 = (r + 1) * rowH - 14;
            [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].forEach(([px, py]) => {
              hCtx.beginPath(); hCtx.arc(px, py, 3.5, 0, Math.PI * 2); hCtx.fill();
              aCtx.beginPath(); aCtx.arc(px, py, 2.0, 0, Math.PI * 2); aCtx.fill();
            });
          }
        }
      }

      const hData = hCtx.getImageData(0, 0, size, size).data;
      const nCanvas = document.createElement('canvas');
      nCanvas.width = size; nCanvas.height = size;
      const nCtx = nCanvas.getContext('2d');
      const nImgData = nCtx.createImageData(size, size);
      const nData = nImgData.data;

      const getH = (x, y) => {
        const cx = (x + size) % size;
        const cy = (y + size) % size;
        return hData[(cy * size + cx) * 4] / 255.0;
      };

      const strength = 4.2;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = (getH(x + 1, y) - getH(x - 1, y)) * strength;
          const dy = (getH(x, y + 1) - getH(x, y - 1)) * strength;
          const dz = 1.0;
          const len = Math.hypot(dx, dy, dz);
          const nx = -dx / len;
          const ny = -dy / len;
          const nz = dz / len;
          const idx = (y * size + x) * 4;
          nData[idx]     = Math.floor(((nx + 1) / 2) * 255);
          nData[idx + 1] = Math.floor(((ny + 1) / 2) * 255);
          nData[idx + 2] = Math.floor(((nz + 1) / 2) * 255);
          nData[idx + 3] = 255;
        }
      }
      nCtx.putImageData(nImgData, 0, 0);

      const rCanvas = document.createElement('canvas');
      rCanvas.width = size; rCanvas.height = size;
      const rCtx = rCanvas.getContext('2d');
      const grayVal = Math.floor(roughnessVal * 255);
      rCtx.fillStyle = `rgb(${grayVal}, ${grayVal}, ${grayVal})`;
      rCtx.fillRect(0, 0, size, size);
      
      rCtx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      for (let i = 0; i < 140; i++) {
        const sy = Math.random() * size;
        const len = 40 + Math.random() * 100;
        const sx = Math.random() * (size - len);
        rCtx.beginPath(); rCtx.moveTo(sx, sy); rCtx.lineTo(sx + len, sy); rCtx.stroke();
      }

      const aTex = new THREE.CanvasTexture(aCanvas);
      const nTex = new THREE.CanvasTexture(nCanvas);
      const rTex = new THREE.CanvasTexture(rCanvas);
      aTex.wrapS = aTex.wrapT = THREE.RepeatWrapping;
      nTex.wrapS = nTex.wrapT = THREE.RepeatWrapping;
      rTex.wrapS = rTex.wrapT = THREE.RepeatWrapping;
      aTex.encoding = THREE.sRGBEncoding;

      return new THREE.MeshStandardMaterial({
        map: aTex,
        normalMap: nTex,
        normalScale: new THREE.Vector2(1.4, 1.4),
        roughnessMap: rTex,
        roughness: roughnessVal,
        metalness: metalnessVal
      });
    }

    // =========================================================================
    // 4. HẬU CẢNH VŨ TRỤ 360° EQUIRECTANGULAR SIÊU THỰC & SIÊU HÀNH TINH BĂNG GIÁ
    // =========================================================================
    const spaceGroup = new THREE.Group();
    scene.add(spaceGroup);

    function createEquirectangularCosmicTexture() {
      const w = 2048, h = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');

      // 4.1. Nền không gian sâu thẳm
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#010208');
      bgGrad.addColorStop(0.3, '#020614');
      bgGrad.addColorStop(0.5, '#050c20');
      bgGrad.addColorStop(0.7, '#020612');
      bgGrad.addColorStop(1, '#010206');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 4.2. Dải tinh vân khí quyển điện ảnh (Cinematic Nebulae)
      function drawNebulaCloud(cx, cy, rx, ry, colorStop1, colorStop2, rot) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);
        const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, Math.max(rx, ry));
        grad.addColorStop(0, colorStop1);
        grad.addColorStop(0.45, colorStop2);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawNebulaCloud(w * 0.50, h * 0.40, 520, 260, 'rgba(14, 165, 233, 0.35)', 'rgba(56, 189, 248, 0.08)', -0.15);
      drawNebulaCloud(w * 0.45, h * 0.46, 420, 180, 'rgba(168, 85, 247, 0.28)', 'rgba(147, 51, 234, 0.06)', 0.25);
      drawNebulaCloud(w * 0.75, h * 0.30, 380, 200, 'rgba(56, 189, 248, 0.22)', 'rgba(3, 105, 161, 0.05)', -0.30);
      drawNebulaCloud(w * 0.20, h * 0.35, 450, 220, 'rgba(99, 102, 241, 0.25)', 'rgba(67, 56, 202, 0.05)', 0.18);

      // 4.3. Hàng ngàn vì sao 3D vi mô rải khắp vũ trụ (4,000 sao)
      for (let i = 0; i < 4000; i++) {
        const sx = Math.random() * w;
        const sy = Math.random() * h;
        const rad = Math.random() < 0.96 ? (0.4 + Math.random() * 0.8) : (1.5 + Math.random() * 1.8);
        const alpha = 0.35 + Math.random() * 0.65;

        const dice = Math.random();
        if (dice > 0.70) ctx.fillStyle = `rgba(56, 189, 248, ${alpha})`;
        else if (dice > 0.45) ctx.fillStyle = `rgba(192, 132, 252, ${alpha})`;
        else ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;

        ctx.beginPath();
        ctx.arc(sx, sy, rad, 0, Math.PI * 2);
        ctx.fill();

        if (rad > 2.0) {
          ctx.strokeStyle = `rgba(224, 242, 254, ${alpha * 0.6})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(sx - rad * 3.5, sy); ctx.lineTo(sx + rad * 3.5, sy);
          ctx.moveTo(sx, sy - rad * 3.5); ctx.lineTo(sx, sy + rad * 3.5);
          ctx.stroke();
        }
      }

      // 4.4. Siêu Hành Tinh Băng Giá Khổng Lồ Chi Tiết Điện Ảnh Tại Chân Trời Vòm Kính
      const px = w * 0.50;
      const py = h * 0.88;
      const pr = 360;

      // Đại dương sâu thẳm & ánh sáng phản quang
      const planetGrad = ctx.createRadialGradient(px - pr * 0.35, py - pr * 0.40, 20, px, py, pr);
      planetGrad.addColorStop(0, '#164e63');
      planetGrad.addColorStop(0.35, '#0e7490');
      planetGrad.addColorStop(0.65, '#0369a1');
      planetGrad.addColorStop(0.85, '#075985');
      planetGrad.addColorStop(1, '#021e38');
      ctx.fillStyle = planetGrad;
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();

      // Các mảng lục địa thềm ngọc bích phát sáng viền
      ctx.save();
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.clip();

      for (let c = 0; c < 32; c++) {
        const lx = px - pr * 0.8 + ((c * 43) % (pr * 1.6));
        const ly = py - pr * 0.6 + ((c * 37) % (pr * 1.2));
        const lRadX = 40 + (c * 11) % 85;
        const lRadY = 22 + (c * 7) % 55;

        ctx.fillStyle = c % 2 === 0 ? '#047857' : '#059669';
        ctx.beginPath();
        ctx.ellipse(lx, ly, lRadX, lRadY, (c * 0.4), 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // Tầng mây bão xoáy khí quyển màu trắng ngọc trai
      ctx.fillStyle = 'rgba(240, 249, 255, 0.65)';
      for (let m = 0; m < 42; m++) {
        const mx = px - pr * 0.85 + ((m * 39) % (pr * 1.7));
        const my = py - pr * 0.70 + ((m * 31) % (pr * 1.3));
        ctx.beginPath();
        ctx.ellipse(mx, my, 65 + (m * 8) % 75, 14 + (m * 3) % 22, (m * 0.32), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Vành đai tán xạ khí quyển Rayleigh phát quang rực rỡ ôm trọn đỉnh hành tinh
      const atmoGrad = ctx.createRadialGradient(px, py, pr - 8, px, py, pr + 42);
      atmoGrad.addColorStop(0, 'rgba(56, 189, 248, 0.95)');
      atmoGrad.addColorStop(0.3, 'rgba(14, 165, 233, 0.60)');
      atmoGrad.addColorStop(0.7, 'rgba(3, 105, 161, 0.20)');
      atmoGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = atmoGrad;
      ctx.beginPath();
      ctx.arc(px, py, pr + 42, 0, Math.PI * 2);
      ctx.fill();

      const tex = new THREE.CanvasTexture(canvas);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    const cosmicTexture = createEquirectangularCosmicTexture();
    const cosmicSkyGeo = new THREE.SphereGeometry(140, 64, 36);
    const cosmicSkyMat = new THREE.MeshBasicMaterial({
      map: cosmicTexture,
      side: THREE.BackSide,
      fog: false
    });
    const cosmicSkyMesh = new THREE.Mesh(cosmicSkyGeo, cosmicSkyMat);
    cosmicSkyMesh.position.set(0, 0, 0);
    spaceGroup.add(cosmicSkyMesh);

    // =========================================================================
    // 5. KIẾN TRÚC BUỒNG LÁI TÀU VŨ TRỤ 3D PBR ĐIỆN ẢNH (CINEMATIC PBR BRIDGE)
    // =========================================================================
    const cockpitGroup = new THREE.Group();
    scene.add(cockpitGroup);

    // 5.1. Bộ vật liệu PBR kim loại titan xước phay và đinh tán cơ khí
    const hullTitanPbrMat = createSciFiPanelMaterial('#0a1526', 0.45, 0.85, 4, 8, true);
    const hullDarkPbrMat = createSciFiPanelMaterial('#040a15', 0.55, 0.80, 4, 8, true);
    const floorPbrMat = createSciFiPanelMaterial('#060d1b', 0.50, 0.75, 8, 10, true);
    floorPbrMat.map.repeat.set(4, 5);
    floorPbrMat.normalMap.repeat.set(4, 5);
    floorPbrMat.roughnessMap.repeat.set(4, 5);

    // 5.2. Mặt sàn kim loại titan công nghiệp (Y = 0)
    const floorDeck = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 9.5), floorPbrMat);
    floorDeck.rotation.x = -Math.PI / 2;
    floorDeck.position.set(0, 0, -0.5);
    floorDeck.receiveShadow = true;
    cockpitGroup.add(floorDeck);

    // 2 Rãnh dẫn năng lượng neon cyan nổi bật chạy dọc sàn
    const conduitGlowMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.90,
      blending: THREE.AdditiveBlending
    });
    const leftConduit = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 8.5), conduitGlowMat);
    leftConduit.position.set(-1.30, 0.012, -0.5);
    cockpitGroup.add(leftConduit);

    const rightConduit = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 8.5), conduitGlowMat);
    rightConduit.position.set(1.30, 0.012, -0.5);
    cockpitGroup.add(rightConduit);

    // 5.3. Bệ chỉ huy bát giác PBR cao cấp (Command Dais - Y = 0.08m)
    const daisPbrMat = createSciFiPanelMaterial('#081222', 0.40, 0.88, 4, 4, true);
    const daisGeo = new THREE.CylinderGeometry(0.88, 0.98, 0.08, 8);
    const daisMesh = new THREE.Mesh(daisGeo, daisPbrMat);
    daisMesh.position.set(0, 0.04, 0);
    daisMesh.receiveShadow = true;
    cockpitGroup.add(daisMesh);

    // Viền LED sườn neon cyan sắc cạnh
    const daisRimGeo = new THREE.CylinderGeometry(0.89, 0.99, 0.04, 8, 1, true);
    const daisRimMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      side: THREE.DoubleSide
    });
    const daisRim = new THREE.Mesh(daisRimGeo, daisRimMat);
    daisRim.position.set(0, 0.06, 0);
    cockpitGroup.add(daisRim);

    // Ma trận Rune vi mạch phát quang nhịp thở trên mặt bệ (floor_rune_glow.png)
    const texLoader = new THREE.TextureLoader();
    let runeMat = null;
    texLoader.load(
      'https://appassets.androidplatform.net/assets/images/floor_rune_glow.png',
      function (texture) {
        texture.encoding = THREE.sRGBEncoding;
        const runeGeo = new THREE.PlaneGeometry(1.65, 1.65);
        runeMat = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 0.98,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -4,
          polygonOffsetUnits: -4,
          side: THREE.DoubleSide
        });
        const runeMesh = new THREE.Mesh(runeGeo, runeMat);
        runeMesh.rotation.x = -Math.PI / 2;
        runeMesh.position.set(0, 0.086, 0);
        cockpitGroup.add(runeMesh);
      }
    );

    // Shadow Catcher đón bóng đổ mềm mại dưới chân nhân vật
    const shadowGeo = new THREE.PlaneGeometry(1.7, 1.7);
    const shadowMat = new THREE.ShadowMaterial({ opacity: 0.55 });
    const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
    shadowMesh.rotation.x = -Math.PI / 2;
    shadowMesh.position.set(0, 0.083, 0);
    shadowMesh.receiveShadow = true;
    cockpitGroup.add(shadowMesh);

    // 5.4. Khung vách cửa sổ vòm quan sát titan PBR (Panoramic Bulkhead - Z = -4.5m)
    const bulkheadGroup = new THREE.Group();
    bulkheadGroup.position.set(0, 0, -4.5);
    cockpitGroup.add(bulkheadGroup);

    const leftWallPlate = new THREE.Mesh(new THREE.BoxGeometry(1.6, 3.8, 0.3), hullTitanPbrMat);
    leftWallPlate.position.set(-2.8, 1.9, 0);
    leftWallPlate.castShadow = true;
    bulkheadGroup.add(leftWallPlate);

    const rightWallPlate = new THREE.Mesh(new THREE.BoxGeometry(1.6, 3.8, 0.3), hullTitanPbrMat);
    rightWallPlate.position.set(2.8, 1.9, 0);
    rightWallPlate.castShadow = true;
    bulkheadGroup.add(rightWallPlate);

    const topWallPlate = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.8, 0.3), hullTitanPbrMat);
    topWallPlate.position.set(0, 3.4, 0);
    topWallPlate.castShadow = true;
    bulkheadGroup.add(topWallPlate);

    const bottomWallPlate = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.5, 0.3), hullTitanPbrMat);
    bottomWallPlate.position.set(0, 0.25, 0);
    bottomWallPlate.receiveShadow = true;
    bulkheadGroup.add(bottomWallPlate);

    // Thanh giằng vòm kính titan chịu lực
    const archTopBezel = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.16, 0.36), hullDarkPbrMat);
    archTopBezel.position.set(0, 2.95, 0.05);
    bulkheadGroup.add(archTopBezel);

    const archBottomBezel = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.16, 0.36), hullDarkPbrMat);
    archBottomBezel.position.set(0, 0.52, 0.05);
    bulkheadGroup.add(archBottomBezel);

    const leftMullion = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.35, 0.22), hullDarkPbrMat);
    leftMullion.position.set(-1.15, 1.72, 0.06);
    leftMullion.rotation.z = -0.09;
    bulkheadGroup.add(leftMullion);

    const rightMullion = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.35, 0.22), hullDarkPbrMat);
    rightMullion.position.set(1.15, 1.72, 0.06);
    rightMullion.rotation.z = 0.09;
    bulkheadGroup.add(rightMullion);

    // 5.5. Hai vách hông buồng lái với cột trụ vát và ống thủy lực chrome
    function createSidePillar(xPos, zPos, isLeft) {
      const pGroup = new THREE.Group();
      pGroup.position.set(xPos, 0, zPos);

      const colMesh = new THREE.Mesh(new THREE.BoxGeometry(0.38, 3.8, 0.48), hullTitanPbrMat);
      colMesh.position.set(0, 1.9, 0);
      colMesh.rotation.z = isLeft ? -0.07 : 0.07;
      colMesh.castShadow = true;
      pGroup.add(colMesh);

      const tube = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 3.6, 16),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.95, roughness: 0.15 })
      );
      tube.position.set(isLeft ? 0.22 : -0.22, 1.9, 0);
      pGroup.add(tube);

      return pGroup;
    }

    cockpitGroup.add(createSidePillar(-2.85, -1.8, true));
    cockpitGroup.add(createSidePillar(2.85, -1.8, false));
    cockpitGroup.add(createSidePillar(-3.05, 1.2, true));
    cockpitGroup.add(createSidePillar(3.05, 1.2, false));

    // 5.6. Hai cụm bàn điều khiển chiến hạm 3D (Tactical Consoles)
    function createBridgeConsole(xPos, zPos, rotY) {
      const cGroup = new THREE.Group();
      cGroup.position.set(xPos, 0, zPos);
      cGroup.rotation.y = rotY;

      const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.80, 0.65), hullDarkPbrMat);
      baseMesh.position.set(0, 0.40, 0);
      baseMesh.castShadow = true;
      cGroup.add(baseMesh);

      const deskTop = new THREE.Mesh(new THREE.BoxGeometry(1.10, 0.05, 0.58), hullTitanPbrMat);
      deskTop.position.set(0, 0.82, -0.04);
      deskTop.rotation.x = 0.32;
      cGroup.add(deskTop);

      const keys = new THREE.Mesh(
        new THREE.BoxGeometry(0.36, 0.02, 0.20),
        new THREE.MeshBasicMaterial({ color: 0x0284c7 })
      );
      keys.position.set(-0.24, 0.86, -0.03);
      keys.rotation.x = 0.32;
      cGroup.add(keys);

      const screen = new THREE.Mesh(
        new THREE.BoxGeometry(0.44, 0.26, 0.02),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      screen.position.set(0.24, 0.94, -0.12);
      screen.rotation.x = 0.20;
      cGroup.add(screen);

      return cGroup;
    }

    cockpitGroup.add(createBridgeConsole(-1.85, -1.5, 0.42));
    cockpitGroup.add(createBridgeConsole(1.85, -1.5, -0.42));

    // 5.7. Vòm trần cơ khí và máng đèn huỳnh quang công nghiệp (Y = 3.6m)
    const ceilingMesh = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 9.5), hullDarkPbrMat);
    ceilingMesh.rotation.x = Math.PI / 2;
    ceilingMesh.position.set(0, 3.6, -0.5);
    cockpitGroup.add(ceilingMesh);

    const lightHousingGeo = new THREE.BoxGeometry(0.18, 0.08, 4.2);
    const tubeMat = new THREE.MeshStandardMaterial({
      color: 0xe0f2fe,
      emissive: 0x38bdf8,
      emissiveIntensity: 2.5,
      roughness: 0.1
    });

    const leftLightBox = new THREE.Mesh(lightHousingGeo, hullDarkPbrMat);
    leftLightBox.position.set(-0.90, 3.56, -0.4);
    const leftTube = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.02, 4.1), tubeMat);
    leftTube.position.set(0, -0.045, 0);
    leftLightBox.add(leftTube);
    cockpitGroup.add(leftLightBox);

    const rightLightBox = new THREE.Mesh(lightHousingGeo, hullDarkPbrMat);
    rightLightBox.position.set(0.90, 3.56, -0.4);
    const rightTube = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.02, 4.1), tubeMat);
    rightTube.position.set(0, -0.045, 0);
    rightLightBox.add(rightTube);
    cockpitGroup.add(rightLightBox);

    // 5.8. Màn hình Hologram 3D bay lơ lửng hiển thị sóng xung nhịp và radar quét
    function createHoloScreen(title, lines, isRadar, w, h, xPos, yPos, zPos, rotY) {
      const canvas = document.createElement('canvas');
      canvas.width = 384;
      canvas.height = 216;
      const ctx = canvas.getContext('2d');

      function render(time) {
        ctx.clearRect(0, 0, 384, 216);

        ctx.fillStyle = 'rgba(2, 12, 28, 0.65)';
        ctx.fillRect(4, 4, 376, 208);

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 4, 376, 208);

        ctx.font = 'bold 15px monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(title, 16, 28);

        ctx.fillStyle = 'rgba(56, 189, 248, 0.40)';
        ctx.fillRect(16, 36, 352, 1.5);

        ctx.font = '11px monospace';
        ctx.fillStyle = '#bae6fd';
        lines.forEach((l, idx) => ctx.fillText(l, 16, 60 + idx * 19));

        if (isRadar) {
          const cx = 300, cy = 135, rad = 42;
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.60)';
          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = '#38bdf8';
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(time * 2.2) * rad, cy + Math.sin(time * 2.2) * rad);
          ctx.stroke();
        } else {
          ctx.strokeStyle = '#38bdf8';
          ctx.beginPath();
          for (let px = 0; px < 352; px += 4) {
            const py = 155 + Math.sin(px * 0.06 + time * 3.2) * 14;
            if (px === 0) ctx.moveTo(16 + px, py);
            else ctx.lineTo(16 + px, py);
          }
          ctx.stroke();
        }
      }

      render(0);
      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: 0.90,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.set(xPos, yPos, zPos);
      mesh.rotation.y = rotY;
      cockpitGroup.add(mesh);

      return {
        update: (t) => {
          render(t);
          texture.needsUpdate = true;
          mesh.position.y = yPos + Math.sin(t * 1.6 + xPos) * 0.015;
        }
      };
    }

    const holoLeft = createHoloScreen(
      'UNITED AI // CORE',
      ['WARP CORE: ONLINE', 'QUANTUM FLUX: 99.8%', 'STABILIZER: ACTIVE', 'SYS TEMP: 312K'],
      false,
      0.68, 0.40,
      -1.05, 1.25, -0.55, 0.32
    );

    const holoRight = createHoloScreen(
      'ORBIT RADAR // SECTOR',
      ['SECTOR: CYGNUS-ALPHA', 'TARGET: ORBIT STN', 'DEFENSE: ARMED', 'TRACKING: LOCKED'],
      true,
      0.68, 0.40,
      1.05, 1.25, -0.55, -0.32
    );

    // =========================================================================
    // 6. TẢI MÔ HÌNH NHÂN VẬT TIỂU BẢO BẢO (GLB) ĐỨNG CHÍNH DIỆN TRÊN BỆ
    // =========================================================================
    let characterModel = null;
    let chestBone = null;
    const gltfLoader = new THREE.GLTFLoader();

    gltfLoader.load(
      'https://appassets.androidplatform.net/assets/models/character_female.glb',
      function (gltf) {
        characterModel = gltf.scene;
        characterModel.position.set(0, 0.08, 0);
        characterModel.scale.set(1.0, 1.0, 1.0);
        characterModel.rotation.y = targetRotationY;

        characterModel.traverse(function (node) {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) {
              node.material.roughness = 0.45;
              node.material.metalness = 0.10;
            }
          }
          if (node.isBone) {
            if (node.name === 'J_Bip_L_UpperArm') {
              node.rotation.z = 1.25; node.rotation.x = -0.15; node.rotation.y = 0.12;
            }
            if (node.name === 'J_Bip_R_UpperArm') {
              node.rotation.z = -1.25; node.rotation.x = -0.15; node.rotation.y = -0.12;
            }
            if (node.name === 'J_Bip_L_LowerArm') node.rotation.z = 0.15;
            if (node.name === 'J_Bip_R_LowerArm') node.rotation.z = -0.15;
          }
        });

        characterModel.rotation.y = FRONT_FACING_ROTATION_Y;
        currentRotationY = FRONT_FACING_ROTATION_Y;
        targetRotationY = FRONT_FACING_ROTATION_Y;

        scene.add(characterModel);
        resetIdleTimer();
      },
      undefined,
      (err) => console.warn('GLTF Load Error:', err)
    );

    // =========================================================================
    // 7. BỘ ĐIỀU KHIỂN CỬ CHỈ CÔNG THÁI HỌC KHÔNG BAO GIỜ BỊ RESET ZOOM
    // =========================================================================
    const activePointers = new Map();
    let isMultiTouchActive = false;
    let multiTouchCooldownUntil = 0;
    let initialPinchDist = 0;
    let pinchStartDistance = DEFAULT_DIST;

    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;

    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    const dom = renderer.domElement;

    dom.addEventListener('pointerdown', (e) => {
      activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY,
        startX: e.clientX,
        startY: e.clientY,
        startTime: performance.now()
      });

      if (activePointers.size === 1) {
        isDragging = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
      } else if (activePointers.size >= 2) {
        isMultiTouchActive = true;
        isDragging = false;
        const pts = Array.from(activePointers.values());
        initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinchStartDistance = targetDistance;
        multiTouchCooldownUntil = performance.now() + 450;
      }

      resetIdleTimer();
    }, { passive: true });

    dom.addEventListener('pointermove', (e) => {
      const p = activePointers.get(e.pointerId);
      if (p) {
        p.x = e.clientX;
        p.y = e.clientY;
      }

      if (activePointers.size >= 2 && initialPinchDist > 0) {
        const pts = Array.from(activePointers.values());
        const currentPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (currentPinchDist > 5) {
          const pinchFactor = initialPinchDist / currentPinchDist;
          targetDistance = Math.max(0.95, Math.min(4.80, pinchStartDistance * pinchFactor));
        }
        multiTouchCooldownUntil = performance.now() + 450;
      } else if (activePointers.size === 1 && isDragging) {
        const deltaX = e.clientX - lastPointerX;
        const deltaY = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        targetRotationY += deltaX * 0.007;
        targetCamY = Math.max(0.85, Math.min(1.30, targetCamY - deltaY * 0.0015));
      }

      resetIdleTimer();
    }, { passive: true });

    function handlePointerRelease(e) {
      const p = activePointers.get(e.pointerId);
      const now = performance.now();

      if (p) {
        const moveDist = Math.hypot(e.clientX - p.startX, e.clientY - p.startY);
        const duration = now - p.startTime;

        const isCleanSingleTap = !isMultiTouchActive &&
                                 (now > multiTouchCooldownUntil) &&
                                 (moveDist < 12) &&
                                 (duration < 260);

        if (isCleanSingleTap) {
          const timeSinceLast = now - lastTapTime;
          const distBetweenTaps = Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY);

          if (timeSinceLast > 60 && timeSinceLast < 320 && distBetweenTaps < 25) {
            onSafeDoubleTap();
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            lastTapX = e.clientX;
            lastTapY = e.clientY;
          }
        }

        activePointers.delete(e.pointerId);
      }

      if (activePointers.size === 0) {
        isDragging = false;
        isMultiTouchActive = false;
        initialPinchDist = 0;
      } else if (activePointers.size === 1) {
        const remaining = Array.from(activePointers.values())[0];
        lastPointerX = remaining.x;
        lastPointerY = remaining.y;
      }

      resetIdleTimer();
    }

    dom.addEventListener('pointerup', handlePointerRelease, { passive: true });
    dom.addEventListener('pointercancel', handlePointerRelease, { passive: true });

    let isCloseUp = false;
    function onSafeDoubleTap() {
      isCloseUp = !isCloseUp;
      targetDistance = isCloseUp ? 1.15 : DEFAULT_DIST;
      targetCamY = isCloseUp ? 1.72 : DEFAULT_CAM_Y;
      targetRotationY = FRONT_FACING_ROTATION_Y;
    }

    // =========================================================================
    // 8. AUTO IDLE DIRECTOR BẢO TOÀN 100% CỰ LY ZOOM HIỆN TẠI
    // =========================================================================
    const IDLE_TIMEOUT_MS = 15000;
    let idleTimer = null;
    let isAutoRotating = false;

    function resetIdleTimer() {
      isAutoRotating = false;
      clearTimeout(idleTimer);
      if (characterModel) {
        idleTimer = setTimeout(onIdleTimeout, IDLE_TIMEOUT_MS);
      }
    }

    function onIdleTimeout() {
      if (characterModel) {
        isAutoRotating = true;
      }
    }

    // =========================================================================
    // 9. VÒNG LẶP RENDER 60 FPS & HOẠT HOẠ ĐIỆN ẢNH
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (isAutoRotating) {
        const idleSway = Math.sin(elapsed * 0.8) * 0.05;
        targetRotationY = THREE.MathUtils.lerp(targetRotationY, FRONT_FACING_ROTATION_Y + idleSway, 0.04);
      }

      currentRotationY = THREE.MathUtils.lerp(currentRotationY, targetRotationY, 0.08);
      if (characterModel) {
        characterModel.rotation.y = currentRotationY;
      }

      currentDistance = THREE.MathUtils.lerp(currentDistance, targetDistance, 0.09);
      currentCamY = THREE.MathUtils.lerp(currentCamY, targetCamY, 0.09);

      const parallaxX = Math.sin(currentRotationY * 0.12) * 0.15;
      camera.position.set(parallaxX, currentCamY, currentDistance);
      const targetLookY = isCloseUp ? 1.60 : (DEFAULT_TARGET_Y + (currentCamY - DEFAULT_CAM_Y) * 0.4);
      cameraTarget.y = THREE.MathUtils.lerp(cameraTarget.y, targetLookY, 0.1);
      camera.lookAt(cameraTarget);

      if (cosmicSkyMesh) {
        cosmicSkyMesh.rotation.y = elapsed * 0.0008;
      }

      holoLeft.update(elapsed);
      holoRight.update(elapsed);

      if (runeMat) {
        const pulse = 0.70 + 0.30 * Math.sin(elapsed * 2.2);
        runeMat.opacity = pulse;
        floorRuneLight.intensity = 0.20 + 0.15 * pulse;
      }

      if (chestBone) {
        chestBone.rotation.x = 0.022 * Math.sin(elapsed * 2.0);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    });
  </script>
</body>
