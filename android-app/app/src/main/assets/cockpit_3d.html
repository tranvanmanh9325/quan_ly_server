<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sci-Fi Cinematic Command Bridge - Tieu Bao Bao</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010206;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }

    /* HUD Header tối giản phong cách chiến hạm */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      background: rgba(1, 4, 12, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.28);
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(56, 189, 248, 0.12);
      transition: opacity 0.6s ease;
    }
    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8, 0 0 16px rgba(56, 189, 248, 0.7);
      animation: pulseDot 2.2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .hud-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e0f2fe;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* HUD Footer chuyển đổi môi trường siêu tối giản */
    .env-selector-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(1, 5, 14, 0.70);
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
      opacity: 0.45;
      transition: opacity 0.4s ease, transform 0.3s ease;
    }
    .env-selector-container:hover,
    .env-selector-container.active-state {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
    .env-dot-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.22s ease;
      touch-action: manipulation;
    }
    .env-dot-btn .btn-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #475569;
      transition: all 0.22s ease;
    }
    .env-dot-btn.active {
      color: #f0f9ff;
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.40);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .env-dot-btn.active .btn-indicator {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8, 0 0 14px rgba(56, 189, 248, 0.8);
    }

    /* Mẹo chỉ dẫn cử chỉ */
    .gesture-hint {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
      pointer-events: none;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.55);
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.6s ease;
    }
  </style>
  <script src="https://appassets.androidplatform.net/assets/js/three.min.js"></script>
  <script src="https://appassets.androidplatform.net/assets/js/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-header" id="hud-header">
    <div class="hud-dot"></div>
    <div class="hud-title">COMMAND BRIDGE // UNITED AI SYSTEM</div>
  </div>

  <div class="gesture-hint" id="gesture-hint">
    Vuốt để xoay 360° • Chụm hoặc Chạm 2 lần để Thu Phóng
  </div>

  <div class="env-selector-container active-state" id="env-selector">
    <button class="env-dot-btn active" id="btn-env-orbit" data-mode="orbit">
      <div class="btn-indicator"></div>
      <span>Hành Tinh</span>
    </button>
    <button class="env-dot-btn" id="btn-env-nebula" data-mode="nebula">
      <div class="btn-indicator"></div>
      <span>Tinh Vân</span>
    </button>
    <button class="env-dot-btn" id="btn-env-warp" data-mode="warp">
      <div class="btn-indicator"></div>
      <span>Siêu Không Gian</span>
    </button>
  </div>

  <script>
    // =========================================================================
    // 1. KHỞI TẠO THREE.JS ENGINE & KHÔNG GIAN BUỒNG LÁI CHIẾN HẠM CHUẨN CONCEPT
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    // Cự ly chuẩn Cinematic Full-Body: Thấy từ gót chân trên bệ rune đến đỉnh đầu
    const DEFAULT_DIST = 3.108;
    const DEFAULT_CAM_Y = 1.05;
    const DEFAULT_TARGET_Y = 0.80;
    let currentDistance = DEFAULT_DIST;
    let targetDistance = DEFAULT_DIST;
    let currentCamY = DEFAULT_CAM_Y;
    let targetCamY = DEFAULT_CAM_Y;
    let targetRotationY = Math.PI; // Mặc định quay mặt ra phía trước
    let currentRotationY = Math.PI;

    camera.position.set(0.0, currentCamY, currentDistance);
    const cameraTarget = new THREE.Vector3(0.0, DEFAULT_TARGET_Y, 0.0);
    camera.lookAt(cameraTarget);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // =========================================================================
    // 2. KHÔNG GIAN HẬU CẢNH CHIẾN HẠM VŨ TRỤ CHUẨN MASTER CONCEPT (1080x1920)
    // Tích hợp trực tiếp tác phẩm cockpit_background_clean.webp chuẩn xác 100%
    // =========================================================================
    const texLoader = new THREE.TextureLoader();
    const bgTexture = texLoader.load(
      'https://appassets.androidplatform.net/assets/images/cockpit_background_clean.webp',
      function (texture) {
        texture.encoding = THREE.sRGBEncoding;
        scene.background = texture;
      }
    );

    // =========================================================================
    // 3. HỆ THỐNG ÁNH SÁNG ĐIỆN ẢNH CHIẾN HẠM ĐỒNG BỘ NỀN CONCEPT
    // =========================================================================
    // 3.1. Ánh sáng môi trường dịu nhẹ làm nổi bật chi tiết nhân vật
    const ambientLight = new THREE.AmbientLight(0x1a263c, 1.25);
    scene.add(ambientLight);

    // 3.2. Dải đèn huỳnh quang từ trần buồng lái chiếu thẳng xuống đỉnh đầu & vai
    const ceilingLight = new THREE.DirectionalLight(0xe0f2fe, 1.6);
    ceilingLight.position.set(0, 3.8, 1.2);
    ceilingLight.castShadow = true;
    ceilingLight.shadow.mapSize.width = 1024;
    ceilingLight.shadow.mapSize.height = 1024;
    ceilingLight.shadow.bias = -0.001;
    scene.add(ceilingLight);

    // 3.3. Đèn hắt ngược từ bệ Rune sàn tàu (Cyan Floor Light) chiếu lên chân và gấu váy
    const floorRuneLight = new THREE.PointLight(0x38bdf8, 1.8, 3.2);
    floorRuneLight.position.set(0, 0.12, 0);
    scene.add(floorRuneLight);

    // 3.4. Cosmic Rim Light từ cửa sổ phía sau hắt vào lưng và đường viền tóc
    const cosmicRimLight = new THREE.DirectionalLight(0x60a5fa, 1.2);
    cosmicRimLight.position.set(0, 1.6, -3.2);
    scene.add(cosmicRimLight);

    // 3.5. Accent Magenta tinh tế từ góc phải
    const accentMagenta = new THREE.PointLight(0xd946ef, 0.45, 5.0);
    accentMagenta.position.set(1.6, 1.2, -0.8);
    scene.add(accentMagenta);

    // =========================================================================
    // 4. BỆ SÀN RUNE MA TRẬN VI MẠCH 3D & SHADOW CATCHER (Y = 0)
    // =========================================================================
    const floorGroup = new THREE.Group();
    scene.add(floorGroup);

    // Shadow Catcher plane nhận bóng đổ mềm của nhân vật
    const shadowGeo = new THREE.PlaneGeometry(3.2, 3.2);
    const shadowMat = new THREE.ShadowMaterial({ opacity: 0.38 });
    const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
    shadowMesh.rotation.x = -Math.PI / 2;
    shadowMesh.position.set(0, 0.005, 0);
    shadowMesh.receiveShadow = true;
    floorGroup.add(shadowMesh);

    // Bệ Rune phát quang vi mạch (floor_rune_glow.png)
    let runeMat = null;
    texLoader.load(
      'https://appassets.androidplatform.net/assets/images/floor_rune_glow.png',
      function (texture) {
        texture.encoding = THREE.sRGBEncoding;
        const runeGeo = new THREE.PlaneGeometry(2.35, 2.35);
        runeMat = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        const runeMesh = new THREE.Mesh(runeGeo, runeMat);
        runeMesh.rotation.x = -Math.PI / 2;
        runeMesh.position.set(0, 0.012, 0);
        floorGroup.add(runeMesh);
      }
    );

    // =========================================================================
    // 5. HỆ THỐNG MÀN HÌNH HOLOGRAM 3D CANVAS LƠ LỬNG
    // =========================================================================
    function createHoloHUD(title, lines, isRadar, xPos, yPos, zPos, rotY) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');

      function renderCanvas(time) {
        ctx.clearRect(0, 0, 512, 300);
        ctx.fillStyle = 'rgba(2, 14, 32, 0.55)';
        ctx.fillRect(4, 4, 504, 292);

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.75)';
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 4, 504, 292);

        ctx.font = 'bold 18px monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(title, 20, 36);

        ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.fillRect(20, 44, 472, 1.5);

        ctx.font = '13px monospace';
        ctx.fillStyle = '#bae6fd';
        lines.forEach((l, idx) => ctx.fillText(l, 20, 72 + idx * 22));

        if (isRadar) {
          const cx = 390, cy = 180, rad = 50;
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(time * 1.8) * rad, cy + Math.sin(time * 1.8) * rad);
          ctx.stroke();
        } else {
          ctx.strokeStyle = '#38bdf8';
          ctx.beginPath();
          for (let px = 0; px < 472; px += 4) {
            const py = 210 + Math.sin(px * 0.05 + time * 3) * 16;
            if (px === 0) ctx.moveTo(20 + px, py);
            else ctx.lineTo(20 + px, py);
          }
          ctx.stroke();
        }
      }

      renderCanvas(0);
      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.44), mat);
      mesh.position.set(xPos, yPos, zPos);
      mesh.rotation.y = rotY;
      scene.add(mesh);

      return {
        update: (t) => {
          renderCanvas(t);
          texture.needsUpdate = true;
          mesh.position.y = yPos + Math.sin(t * 1.5 + xPos) * 0.02;
        }
      };
    }

    const holoLeft = createHoloHUD(
      'UNITED AI SYSTEM // CORE',
      ['WARP CORE: 99.98% STABLE', 'FREQ: 432.8 THz', 'QUANTUM STATUS: ONLINE', 'SYS TEMP: NOMINAL'],
      false,
      -0.88, 1.25, -0.45, 0.28
    );

    const holoRight = createHoloHUD(
      'TARGET SECTOR // RADAR',
      ['SECTOR: CYGNUS-ALPHA', 'TARGET: ORBIT STN', 'DEFENSE: ARMED', 'AUTO ORBIT: ACTIVE'],
      true,
      0.88, 1.25, -0.45, -0.28
    );

    // =========================================================================
    // 6. HIỆU ỨNG MÔI TRƯỜNG PHỤ (TINH VÂN & SIÊU KHÔNG GIAN)
    // =========================================================================
    const envFxGroup = new THREE.Group();
    scene.add(envFxGroup);

    // Tinh vân hạt bụi vũ trụ
    const nebCanvas = document.createElement('canvas');
    nebCanvas.width = 128; nebCanvas.height = 128;
    const nCtx = nebCanvas.getContext('2d');
    const nRad = nCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
    nRad.addColorStop(0, 'rgba(217, 70, 239, 0.8)');
    nRad.addColorStop(0.4, 'rgba(56, 189, 248, 0.4)');
    nRad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    nCtx.fillStyle = nRad;
    nCtx.fillRect(0, 0, 128, 128);

    const nebMat = new THREE.PointsMaterial({
      size: 1.2,
      map: new THREE.CanvasTexture(nebCanvas),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.55
    });
    const nebGeo = new THREE.BufferGeometry();
    const nebPos = new Float32Array(160 * 3);
    for (let i = 0; i < 160; i++) {
      nebPos[i * 3]     = (Math.random() - 0.5) * 6.0;
      nebPos[i * 3 + 1] = (Math.random() - 0.5) * 4.5 + 1.0;
      nebPos[i * 3 + 2] = -1.5 - Math.random() * 2.5;
    }
    nebGeo.setAttribute('position', new THREE.BufferAttribute(nebPos, 3));
    const nebPoints = new THREE.Points(nebGeo, nebMat);
    nebPoints.visible = false;
    envFxGroup.add(nebPoints);

    // Siêu không gian (Warp Drive streaks)
    const warpCount = 450;
    const warpGeo = new THREE.BufferGeometry();
    const warpPositions = new Float32Array(warpCount * 6);
    const warpSpeeds = new Float32Array(warpCount);

    for (let i = 0; i < warpCount; i++) {
      const x = (Math.random() - 0.5) * 12.0;
      const y = (Math.random() - 0.5) * 10.0 + 1.0;
      const z = -25.0 + Math.random() * 26.0;
      const len = 0.8 + Math.random() * 1.6;

      warpPositions[i * 6]     = x; warpPositions[i * 6 + 1] = y; warpPositions[i * 6 + 2] = z;
      warpPositions[i * 6 + 3] = x; warpPositions[i * 6 + 4] = y; warpPositions[i * 6 + 5] = z - len;
      warpSpeeds[i] = 1.2 + Math.random() * 1.8;
    }
    warpGeo.setAttribute('position', new THREE.BufferAttribute(warpPositions, 3));
    const warpMat = new THREE.LineBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.90,
      blending: THREE.AdditiveBlending
    });
    const warpLines = new THREE.LineSegments(warpGeo, warpMat);
    warpLines.visible = false;
    envFxGroup.add(warpLines);

    let currentEnvMode = 'orbit';
    function switchEnvironment(mode) {
      if (currentEnvMode === mode) return;
      currentEnvMode = mode;

      document.querySelectorAll('.env-dot-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
      });

      nebPoints.visible = (mode === 'nebula');
      warpLines.visible = (mode === 'warp');

      if (mode === 'nebula') {
        ambientLight.color.setHex(0x28183c);
        cosmicRimLight.color.setHex(0xd946ef);
      } else if (mode === 'warp') {
        ambientLight.color.setHex(0x102035);
        cosmicRimLight.color.setHex(0x38bdf8);
      } else {
        ambientLight.color.setHex(0x1a263c);
        cosmicRimLight.color.setHex(0x60a5fa);
      }
    }

    // =========================================================================
    // 7. TẢI MÔ HÌNH NHÂN VẬT TIỂU BẢO BẢO (GLB) ĐỨNG CHÍNH GIỮA BUỒNG LÁI
    // =========================================================================
    let characterModel = null;
    let chestBone = null;
    const gltfLoader = new THREE.GLTFLoader();

    gltfLoader.load(
      'https://appassets.androidplatform.net/assets/models/character_female.glb',
      function (gltf) {
        characterModel = gltf.scene;
        // Gót chân tiếp xúc chính xác tại Y = 0.0 trên bệ rune
        characterModel.position.set(0, 0.0, 0);
        characterModel.scale.set(1.0, 1.0, 1.0);
        characterModel.rotation.y = targetRotationY;

        characterModel.traverse(function (node) {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) {
              node.material.roughness = 0.42;
              node.material.metalness = 0.12;
            }
          }
          if (node.isBone) {
            // Hạ cánh tay từ T-pose sang tư thế tự nhiên thanh tú
            if (node.name === 'J_Bip_L_UpperArm') {
              node.rotation.z = 1.25; node.rotation.x = -0.15; node.rotation.y = 0.12;
            }
            if (node.name === 'J_Bip_R_UpperArm') {
              node.rotation.z = -1.25; node.rotation.x = -0.15; node.rotation.y = -0.12;
            }
            if (node.name === 'J_Bip_L_LowerArm') node.rotation.z = 0.15;
            if (node.name === 'J_Bip_R_LowerArm') node.rotation.z = -0.15;
            if (node.name === 'J_Bip_C_Chest') chestBone = node;
          }
        });

        scene.add(characterModel);
      },
      undefined,
      (err) => console.warn('GLTF Load Error:', err)
    );

    // =========================================================================
    // 8. BỘ ĐIỀU KHIỂN CỬ CHỈ CÔNG THÁI HỌC KHÔNG BAO GIỜ BỊ RESET ZOOM
    // Tách biệt Multi-touch (Pinch Zoom) và Single-touch (Rotate / Double-Tap)
    // =========================================================================
    const activePointers = new Map();
    let isMultiTouchActive = false;
    let multiTouchCooldownUntil = 0;
    let initialPinchDist = 0;
    let pinchStartDistance = DEFAULT_DIST;

    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;

    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    const dom = renderer.domElement;

    dom.addEventListener('pointerdown', (e) => {
      activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY,
        startX: e.clientX,
        startY: e.clientY,
        startTime: performance.now()
      });

      if (activePointers.size === 1) {
        isDragging = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
      } else if (activePointers.size >= 2) {
        // Bắt đầu cử chỉ chụm 2 ngón thu phóng (Pinch Zoom)
        isMultiTouchActive = true;
        isDragging = false;
        const pts = Array.from(activePointers.values());
        initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinchStartDistance = targetDistance;
        multiTouchCooldownUntil = performance.now() + 450;
      }

      resetIdleTimer();
    }, { passive: true });

    dom.addEventListener('pointermove', (e) => {
      const p = activePointers.get(e.pointerId);
      if (p) {
        p.x = e.clientX;
        p.y = e.clientY;
      }

      if (activePointers.size >= 2 && initialPinchDist > 0) {
        // Xử lý Pinch Zoom
        const pts = Array.from(activePointers.values());
        const currentPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (currentPinchDist > 5) {
          const pinchFactor = initialPinchDist / currentPinchDist;
          // Cự ly cho phép: từ 0.95m (cận cảnh mặt) đến 4.80m (toàn cảnh buồng lái)
          targetDistance = Math.max(0.95, Math.min(4.80, pinchStartDistance * pinchFactor));
        }
        multiTouchCooldownUntil = performance.now() + 450;
      } else if (activePointers.size === 1 && isDragging) {
        // Xoay 360 độ nhân vật khi vuốt ngang
        const deltaX = e.clientX - lastPointerX;
        const deltaY = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        targetRotationY += deltaX * 0.007;

        // Cho phép góc ngắm camera nghiêng nhẹ theo trục Y (pitch)
        targetCamY = Math.max(0.85, Math.min(1.30, targetCamY - deltaY * 0.0015));
      }

      resetIdleTimer();
    }, { passive: true });

    function handlePointerRelease(e) {
      const p = activePointers.get(e.pointerId);
      const now = performance.now();

      if (p) {
        const moveDist = Math.hypot(e.clientX - p.startX, e.clientY - p.startY);
        const duration = now - p.startTime;

        // Chỉ xét Single Tap khi không ở chế độ multi-touch và qua cooldown 450ms
        const isCleanSingleTap = !isMultiTouchActive &&
                                 (now > multiTouchCooldownUntil) &&
                                 (moveDist < 12) &&
                                 (duration < 260);

        if (isCleanSingleTap) {
          const timeSinceLast = now - lastTapTime;
          const distBetweenTaps = Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY);

          if (timeSinceLast > 60 && timeSinceLast < 320 && distBetweenTaps < 25) {
            onSafeDoubleTap();
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            lastTapX = e.clientX;
            lastTapY = e.clientY;
          }
        }

        activePointers.delete(e.pointerId);
      }

      if (activePointers.size === 0) {
        isDragging = false;
        isMultiTouchActive = false;
        initialPinchDist = 0;
      } else if (activePointers.size === 1) {
        // Khi 1 ngón vừa nhấc, ngón còn lại tiếp tục giữ nhưng không coi là swipe mới
        const remaining = Array.from(activePointers.values())[0];
        lastPointerX = remaining.x;
        lastPointerY = remaining.y;
      }

      resetIdleTimer();
    }

    dom.addEventListener('pointerup', handlePointerRelease, { passive: true });
    dom.addEventListener('pointercancel', handlePointerRelease, { passive: true });

    // Double-Tap chuyển đổi mượt giữa Toàn Thân (3.11m) và Cận Cảnh Mặt (1.15m)
    let isCloseUp = false;
    function onSafeDoubleTap() {
      isCloseUp = !isCloseUp;
      targetDistance = isCloseUp ? 1.15 : DEFAULT_DIST;
      targetCamY = isCloseUp ? 1.25 : DEFAULT_CAM_Y;
    }

    // =========================================================================
    // 9. AUTO IDLE DIRECTOR BẢO TOÀN 100% CỰ LY ZOOM HIỆN TẠI
    // Sau 5s: CHỈ xoay chậm nhân vật quanh trục Y, KHÔNG BAO GIỜ ép cự ly zoom!
    // =========================================================================
    const IDLE_TIMEOUT_MS = 5000;
    let idleTimer = null;
    let isAutoRotating = false;

    function resetIdleTimer() {
      isAutoRotating = false;
      const selector = document.getElementById('env-selector');
      if (selector) selector.classList.add('active-state');

      clearTimeout(idleTimer);
      idleTimer = setTimeout(onIdleTimeout, IDLE_TIMEOUT_MS);
    }

    function onIdleTimeout() {
      const selector = document.getElementById('env-selector');
      if (selector) selector.classList.remove('active-state');

      // Tự động xoay chậm nhưng BẢO TOÀN NGUYÊN VẸN CỰ LY ZOOM người dùng vừa đặt
      isAutoRotating = true;
    }

    resetIdleTimer();

    // =========================================================================
    // 10. BIND NÚT CHUYỂN MÔI TRƯỜNG TỐI GIẢN
    // =========================================================================
    document.querySelectorAll('.env-dot-btn').forEach(btn => {
      const handleSwitch = (e) => {
        e.preventDefault();
        e.stopPropagation();
        resetIdleTimer();
        const mode = btn.getAttribute('data-mode');
        switchEnvironment(mode);
      };
      btn.addEventListener('click', handleSwitch);
      btn.addEventListener('pointerdown', handleSwitch);
      btn.addEventListener('touchstart', handleSwitch);
    });

    // =========================================================================
    // 11. VÒNG LẶP RENDER 60 FPS & ANIMATIONS ĐIỆN ẢNH
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const delta = clock.getDelta();

      // Cập nhật góc tự xoay nhàn rỗi
      if (isAutoRotating) {
        targetRotationY += 0.0035;
      }

      // Nội suy mượt mà (smooth damping) góc xoay nhân vật
      currentRotationY = THREE.MathUtils.lerp(currentRotationY, targetRotationY, 0.08);
      if (characterModel) {
        characterModel.rotation.y = currentRotationY;
      }

      // Nội suy mượt mà khoảng cách thu phóng (zoom distance) - BẢO ĐẢM KHÔNG BAO GIỜ GIẬT
      currentDistance = THREE.MathUtils.lerp(currentDistance, targetDistance, 0.09);
      currentCamY = THREE.MathUtils.lerp(currentCamY, targetCamY, 0.09);

      // Hiệu ứng Parallax 3D tinh tế khi nhân vật quay
      const parallaxX = Math.sin(currentRotationY * 0.12) * 0.14;
      camera.position.set(parallaxX, currentCamY, currentDistance);
      cameraTarget.y = THREE.MathUtils.lerp(cameraTarget.y, DEFAULT_TARGET_Y + (currentCamY - DEFAULT_CAM_Y) * 0.4, 0.1);
      camera.lookAt(cameraTarget);

      // Cập nhật Holograms
      holoLeft.update(elapsed);
      holoRight.update(elapsed);

      // Cập nhật hiệu ứng môi trường
      if (currentEnvMode === 'nebula' && nebPoints.visible) {
        nebPoints.rotation.y = elapsed * 0.015;
      } else if (currentEnvMode === 'warp' && warpLines.visible) {
        const pos = warpGeo.attributes.position.array;
        for (let i = 0; i < warpCount; i++) {
          const spd = warpSpeeds[i];
          pos[i * 6 + 2] += spd * 14 * delta;
          pos[i * 6 + 5] += spd * 14 * delta;

          if (pos[i * 6 + 2] > 6.0) {
            const x = (Math.random() - 0.5) * 12.0;
            const y = (Math.random() - 0.5) * 10.0 + 1.0;
            const z = -25.0 - Math.random() * 5.0;
            const len = 0.8 + Math.random() * 1.6;

            pos[i * 6] = x; pos[i * 6 + 1] = y; pos[i * 6 + 2] = z;
            pos[i * 6 + 3] = x; pos[i * 6 + 4] = y; pos[i * 6 + 5] = z - len;
          }
        }
        warpGeo.attributes.position.needsUpdate = true;
      }

      // Nhịp thở năng lượng bệ Rune (floor_rune_glow)
      if (runeMat) {
        const pulse = 0.65 + 0.35 * Math.sin(elapsed * 2.2);
        runeMat.opacity = pulse;
        floorRuneLight.intensity = 1.3 + 0.7 * pulse;
      }

      // Nhịp thở ngực sinh học nhân vật
      if (chestBone) {
        chestBone.rotation.x = 0.022 * Math.sin(elapsed * 2.0);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    });
  </script>
</body>
</html>
