server.port=8080
spring.application.name=mini-server-dashboard
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# SSH Configuration from Environment Variables
ssh.host=${SSH_HOST}
ssh.port=${SSH_PORT}
ssh.user=${SSH_USER}
ssh.password=${SSH_PASSWORD}
ssh.strict-host-key-checking=${SSH_STRICT_HOST_KEY_CHECKING:no}

# Actuator: chỉ expose health endpoint cho healthcheck của Docker
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://db:5432/quan_ly_server
spring.datasource.username=dashboard_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
