server.port=8080
spring.application.name=mini-server-dashboard
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# SSH Configuration from Environment Variables
ssh.host=${SSH_HOST}
ssh.port=${SSH_PORT}
ssh.user=${SSH_USER}
ssh.password=${SSH_PASSWORD}
ssh.strict-host-key-checking=${SSH_STRICT_HOST_KEY_CHECKING:no}


# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://db:5432/quan_ly_server
spring.datasource.username=dashboard_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema migration — auto-create/update schema by default, overridable via env var.
# Migration script: db/migrations/V2__add_disk_percent.sql
# For multi-instance or production: switch to Flyway or set SPRING_JPA_HIBERNATE_DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Auth — single-user credentials. MUST be set via env var; no defaults allowed.
# APP_AUTH_USERNAME: plain username (e.g. admin)
# APP_AUTH_PASSWORD: BCrypt hash of the real password.
#   Generate with: htpasswd -bnBC 12 "" 'yourpassword' | tr -d ':\n' | sed 's/$2y/$2a/'
#   Or in Java:    new BCryptPasswordEncoder(12).encode("yourpassword")
app.auth.username=${APP_AUTH_USERNAME}
app.auth.password=${APP_AUTH_PASSWORD}

# JWT — HS256 secret (>= 32 chars / 256-bit). MUST be set via env var; no defaults allowed.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

# Actuator — expose only health/info; never expose /actuator/env to prevent credential leak.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
