# ==============================================================================
# PostgreSQL 17 Production Tuning for 3.2GB RAM + 2 vCPU Cores + NVMe/SSD
# System Budget: ~512MB-768MB PostgreSQL Engine Shared Memory
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORK & CONNECTION MANAGEMENT
# ------------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# ------------------------------------------------------------------------------
# 2. MEMORY TUNING (Total System RAM: 3.2GB)
# ------------------------------------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 16MB
wal_buffers = 16MB

# ------------------------------------------------------------------------------
# 3. WRITE-AHEAD LOG (WAL) & CHECKPOINTS (Optimized for SSD)
# ------------------------------------------------------------------------------
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
min_wal_size = 256MB
max_wal_size = 2GB
wal_compression = on

# ------------------------------------------------------------------------------
# 4. QUERY PLANNER & DISK TUNING (NVMe / SSD)
# ------------------------------------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
default_statistics_target = 100

# ------------------------------------------------------------------------------
# 5. PARALLEL QUERY EXECUTION (2 Physical CPU Cores)
# ------------------------------------------------------------------------------
max_worker_processes = 2
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# ------------------------------------------------------------------------------
# 6. AUTOMATIC VACUUM & FREEZE TUNING
# ------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ------------------------------------------------------------------------------
# 7. LOGGING & SLOW QUERY MONITORING
# ------------------------------------------------------------------------------
log_min_duration_statement = 2000
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '
