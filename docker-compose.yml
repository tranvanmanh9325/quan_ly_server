services:
  db:
    image: postgres:17-alpine
    container_name: dashboard_db
    restart: unless-stopped
    shm_size: '256m'
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quan_ly_server
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d quan_ly_server"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: dashboard_auth_service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    restart: unless-stopped
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M

  metrics-service:
    init: true
    # Chromium needs /dev/shm for renderer shared memory. 512m is sufficient for headless text-only mode.
    shm_size: '512m'
    build:
      context: ./services/metrics-service
      dockerfile: Dockerfile
    container_name: dashboard_metrics_service
    ports:
      - "8082:8082"
      - "6080:6080"
    env_file:
      - .env
    environment:
      # Use G1GC (better for mixed heap), cap GC threads to 2, and enable full JIT (no TieredStopAtLevel=1).
      # TieredStopAtLevel=1 forces interpreted-only mode which actually makes long-running tasks SLOWER.
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60.0 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          # Cap at 1.2 cores so Chromium cannot monopolize the 4-core i5 during scans.
          # Scan duration increases slightly (~20%) but other services stay responsive.
          cpus: '1.2'
          memory: 1536M
        reservations:
          memory: 512M
    # Lower OS scheduling priority so system tasks preempt Chromium during high load.
    # cpu_shares default = 1024. Setting 512 = half the default scheduling weight.
    cpu_shares: 512
    volumes:
      - fb_profile_data:/var/lib/fb_browser_profile

  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    container_name: dashboard_file_service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    restart: unless-stopped
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard_frontend
    ports:
      - "5173:80"
    depends_on:
      auth-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

networks:
  dashboard-network:
    driver: bridge

volumes:
  postgres_data:
  fb_profile_data: