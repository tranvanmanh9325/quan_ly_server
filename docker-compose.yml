services:
  db:
    image: postgres:17-alpine
    container_name: dashboard_db
    restart: unless-stopped
    stop_grace_period: 15s
    shm_size: '256m'
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quan_ly_server
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d quan_ly_server"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: dashboard_auth_service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 25s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M

  metrics-service:
    build:
      context: ./services/metrics-service
      dockerfile: Dockerfile
    container_name: dashboard_metrics_service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60.0 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:+ExitOnOutOfMemoryError"
      TELEGRAM_POLLING_ENABLED: "false"
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 25s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 512M
        reservations:
          memory: 256M

  ai-agent-service:
    init: true
    shm_size: '512m'
    build:
      context: ./services/ai-agent-service
      dockerfile: Dockerfile
    container_name: dashboard_ai_agent
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dashboard-network
    ports:
      - "8084:8084"
      - "6080:6080"
    shm_size: '1gb'
    volumes:
      # Persistent Chromium profile: preserves E2EE IndexedDB keys across restarts
      # Without this, Facebook E2EE Messenger sidebar never loads in headless mode
      - browser_data:/app/browser_data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8084/health')\""]
      interval: 25s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    cpu_shares: 512

  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    container_name: dashboard_file_service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 25s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard_frontend
    ports:
      - "5173:80"
    depends_on:
      auth-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

networks:
  dashboard-network:
    driver: bridge

volumes:
  postgres_data:
  browser_data: