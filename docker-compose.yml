
services:
  db:
    image: postgres:15-alpine
    container_name: dashboard_db
    restart: unless-stopped
    shm_size: '256m'
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quan_ly_server
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d quan_ly_server"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dashboard-network
    # Actuator /health: không phụ thuộc SSH, trả 200 khi Spring Boot sẵn sàng
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1.5'   # Spring Boot + SSH crypto cần budget hợp lý
          memory: 1G
        reservations:
          memory: 512M  # OOM killer sẽ nhắm vào process khác trước khi đụng container này

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard_frontend
    ports:
      - "5173:80" # Map to standard vite dev port, backed by Nginx port 80
    depends_on:
      backend:
        condition: service_healthy  # Chờ backend healthy trước khi khởi động
    restart: unless-stopped
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'   # Nginx static serving, rất nhẹ
          memory: 256M
        reservations:
          memory: 64M


networks:
  dashboard-network:
    driver: bridge

volumes:
  postgres_data: