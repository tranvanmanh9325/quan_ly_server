# ── Autonomous Security Guardian: Threat Signatures & Mapping ────────────────
# Module: Deception & Web Ingress Defense (R4)
# Managed by: Tiểu Bảo Bảo Autonomous Security Guardian
# Note: Defined in http{} context via include /etc/nginx/conf.d/*.conf;

# ── 1. Malicious Scanner & Exploitation User-Agents ───────────────────────────
map $http_user_agent $bad_client {
    default 0;

    # Vulnerability & Port Scanners
    ~*(sqlmap|nikto|masscan|zgrab|nmap|acunetix|w3af|havij|nessus|openvas) 1;

    # Directory Traversal & Fuzzing Tools
    ~*(gobuster|dirbuster|wfuzz|dirb|commix|arachni|whatweb|shodan|censys) 1;

    # Automated Exploitation & Brute-force Tools
    ~*(metasploit|hydra|medusa|fuzz|crawl|spiderbot) 1;
}

# ── 2. Malicious Query String Detection (SQLi, XSS, Path Traversal) ──────────
map $query_string $bad_query {
    default 0;

    # SQL Injection Signatures
    ~*(union\s+(all\s+)?select|insert\s+into|drop\s+table|information_schema|benchmark\s*\(|sleep\s*\() 1;
    ~*('|\%27).*(\bor\b|\band\b).*(=|<|>|'|") 1;

    # Cross-Site Scripting (XSS) Signatures
    ~*(<script|javascript:|alert\s*\(|onerror\s*=|onload\s*=|document\.cookie|<iframe|<svg) 1;

    # Path Traversal Signatures in Query
    ~*(\.\./|\.\.\\|%2e%2e%2f|%2e%2e/|%2e%2e%5c) 1;
}
