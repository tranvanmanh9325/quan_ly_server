# ── Global Nginx Configuration Override ──────────────────────────────────────
# Overrides the default nginx.conf to enable multi-core worker support,
# optimized connection handling, and performance tuning for container deployments.

user  nginx;
worker_processes  auto;          # Detect available CPU cores automatically
worker_rlimit_nofile  65535;     # Allow many concurrent file descriptors

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;    # Max connections per worker
    multi_accept        on;      # Accept all pending connections at once
    use                 epoll;   # Fastest async I/O model on Linux
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version from response headers (security hardening)
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Proxy defaults (applied globally to reduce per-location repetition)
    proxy_connect_timeout  10s;
    proxy_buffer_size      4k;
    proxy_buffers          8 16k;
    proxy_busy_buffers_size 32k;

    include /etc/nginx/conf.d/*.conf;
}
