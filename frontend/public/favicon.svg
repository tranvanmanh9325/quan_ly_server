<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Cyber Hex Shield -->
  <polygon points="32,4 58,19 58,45 32,60 6,45 6,19" fill="url(#bg-grad)" stroke="url(#cyber-grad)" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Inner Circuit Grid Accent -->
  <polygon points="32,10 52,21.5 52,42.5 32,54 12,42.5 12,21.5" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4,2" opacity="0.5" />
  <!-- Server Rack / Matrix Pulse Lines -->
  <path d="M20 21 H44 M20 28 H44 M20 35 H44 M20 42 H44" stroke="url(#cyber-grad)" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow)" />
  <!-- Active Pulse Core Nodes -->
  <circle cx="26" cy="21" r="2.5" fill="#00ff9d" />
  <circle cx="38" cy="28" r="2.5" fill="#00f3ff" />
  <circle cx="26" cy="35" r="2.5" fill="#00ff9d" />
  <circle cx="38" cy="42" r="2.5" fill="#00f3ff" />
</svg>