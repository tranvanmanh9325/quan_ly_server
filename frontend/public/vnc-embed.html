<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Server VNC Console</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    /*
     * CRITICAL: Do NOT apply any width/height/transform/object-fit CSS to the
     * noVNC canvas element. noVNC with scaleViewport=true manages the canvas
     * intrinsic width/height attributes internally, and uses getBoundingClientRect()
     * on the canvas to compute mouse coordinates. If CSS stretches the canvas
     * differently than its buffer dimensions, two separate scale factors exist
     * and mouse clicks land at wrong coordinates (offset bug).
     *
     * Instead: make the container fill 100% and let noVNC resize the canvas
     * buffer to match — this keeps visual size == buffer size == coordinate space.
     */
    #screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Only safe canvas overrides — no sizing that breaks coordinate system */
    #screen canvas {
      outline: none !important;
      cursor: default;
    }

    #status {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #00f3ff;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      z-index: 100;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 20px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 4px;
      backdrop-filter: blur(4px);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="screen" tabindex="0"></div>
  <div id="status">⟳ Đang kết nối VNC Server...</div>

  <script type="module">
    import RFB from '/fb-vnc/core/rfb.js';

    const screen = document.getElementById('screen');
    const status = document.getElementById('status');

    const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl   = `${wsProto}//${window.location.host}/fb-vnc/websockify`;

    let rfb = null;
    let reconnectTimer = null;
    let isConnecting = false;

    /*
     * scaleViewport=true tells noVNC to:
     *   1. Read the container's actual pixel dimensions via getBoundingClientRect()
     *   2. Resize the <canvas> buffer attributes (width/height) to match exactly
     *   3. Scale the remote framebuffer content to fit — all within one coordinate space
     *
     * This means canvas.width === container.clientWidth at all times, so every
     * mouse click maps perfectly: no offset, no drift.
     */
    function triggerScale() {
      if (!rfb) return;
      try {
        // Toggle off→on forces noVNC to re-read container size and resize canvas
        rfb.scaleViewport = false;
        rfb.scaleViewport = true;
      } catch (e) {
        console.debug('[VNC] triggerScale debug:', e);
      }
    }

    function initVNC() {
      clearTimeout(reconnectTimer);
      if (rfb) {
        try {
          rfb.disconnect();
        } catch (e) {}
        rfb = null;
      }
      
      // Clean up previous canvas elements to avoid ghost elements
      screen.innerHTML = '';
      status.style.display = 'block';
      status.textContent = '⟳ Đang kết nối VNC Server...';

      try {
        rfb = new RFB(screen, wsUrl);
        rfb.viewOnly         = false;
        rfb.scaleViewport    = true;   // noVNC manages canvas size — DO NOT override via CSS
        rfb.resizeSession    = false;  // Keep server resolution fixed at 1280x720 (optimized for L3 Cache)
        rfb.clipViewport     = false;  // Scaling handles fit
        rfb.qualityLevel     = 7;      // High visual quality with sharp text / QR codes
        rfb.compressionLevel = 2;      // Low CPU overhead ZRLE compression for dual-core host
        rfb.showDotCursor    = false;  // Server-rendered hardware cursor
        rfb.background       = '#000000';

        rfb.addEventListener('connect', () => {
          status.style.display = 'none';
          // Auto-focus the screen element so keyboard events are captured
          screen.focus();
          // Fire multiple times: container layout may still be settling
          requestAnimationFrame(triggerScale);
          setTimeout(triggerScale, 150);
          setTimeout(triggerScale, 500);
          setTimeout(triggerScale, 1200);
        });

        rfb.addEventListener('disconnect', (e) => {
          rfb = null;
          status.style.display = 'block';
          if (e.detail && e.detail.clean) {
            status.textContent = '✓ Đã ngắt kết nối VNC';
          } else {
            status.textContent = '⟳ Mất kết nối — đang thử lại...';
            reconnectTimer = setTimeout(initVNC, 2000);
          }
        });

        rfb.addEventListener('credentialsrequired', () => {
          rfb.sendCredentials({ password: '' });
        });

        rfb.addEventListener('securityfailure', (e) => {
          status.style.display = 'block';
          status.textContent = `✕ Lỗi bảo mật VNC: ${e.detail?.reason || 'Authentication failed'}`;
        });

      } catch (err) {
        status.style.display = 'block';
        status.textContent = `✕ Lỗi khởi tạo VNC: ${err.message}`;
        console.error('[VNC] Init error:', err);
      }
    }

    // Auto focus screen on click
    screen.addEventListener('mousedown', () => {
      screen.focus();
    });

    // Re-trigger scale whenever the container is resized (modal open/resize events)
    const ro = new ResizeObserver(() => triggerScale());
    ro.observe(screen);

    // Clean disconnect on page unload
    window.addEventListener('beforeunload', () => {
      clearTimeout(reconnectTimer);
      if (rfb) {
        try { rfb.disconnect(); } catch (e) {}
      }
    });

    initVNC();
  </script>
</body>
</html>
