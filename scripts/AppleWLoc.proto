syntax = "proto2";

message WifiDevice {
	required string bssid = 1;
	message Location {
		optional int64 latitude = 1;
		optional int64 longitude = 2;
		optional int64 unknown_value3 = 3;
		optional int64 unknown_value4 = 4;
		optional int64 unknown_value5 = 5;
		optional int64 unknown_value6 = 6;
		optional int64 unknown_value7 = 7;
		optional int64 unknown_value8 = 8;
		optional int64 unknown_value9 = 9;
		optional int64 unknown_value10 = 10;
		optional int64 unknown_value11 = 11;
		optional int64 unknown_value12 = 12;
		optional int64 altitude = 21;
	}
	optional Location location = 2;
	optional int32 unknown_value3 = 3;
	optional int32 channel = 4;
}

message AppleWLoc {
	repeated WifiDevice wifi_devices = 1;
	optional int32 unknown_value1 = 2;
	optional int32 return_single_result = 3;
}
