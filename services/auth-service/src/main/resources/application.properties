server.port=8081
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
spring.application.name=auth-service
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

app.auth.username=${APP_AUTH_USERNAME}
app.auth.password=${APP_AUTH_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# HTTP Response Gzip Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

