server.port=8082
# Dashboard has very few concurrent users; reducing idle threads lowers OS scheduling overhead.
# Each idle thread holds a 1MB stack + scheduling slot even when doing nothing.
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
spring.application.name=metrics-service
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

ssh.host=${SSH_HOST}
ssh.port=${SSH_PORT}
ssh.user=${SSH_USER}
ssh.password=${SSH_PASSWORD}
ssh.strict-host-key-checking=${SSH_STRICT_HOST_KEY_CHECKING:no}
ssh.fallback-host=${SSH_FALLBACK_HOST:}
ssh.fallback-port=${SSH_FALLBACK_PORT:22}

spring.datasource.url=jdbc:postgresql://db:5432/quan_ly_server
spring.datasource.username=dashboard_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP Connection Pool Optimization (Fixed Pool + Leak Detection + PreparedStatement Caching)
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=6
spring.datasource.hikari.idle-timeout=0
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1500
spring.datasource.hikari.leak-detection-threshold=2500
spring.datasource.hikari.pool-name=MetricsHikariPool
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
telegram.polling-enabled=${TELEGRAM_POLLING_ENABLED:false}

# HTTP Response Gzip Compression (reduces large JSON telemetry payloads by 85%)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024


