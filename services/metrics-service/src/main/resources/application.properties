server.port=8082
# Dashboard has very few concurrent users; reducing idle threads lowers OS scheduling overhead.
# Each idle thread holds a 1MB stack + scheduling slot even when doing nothing.
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
spring.application.name=metrics-service
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

ssh.host=${SSH_HOST}
ssh.port=${SSH_PORT}
ssh.user=${SSH_USER}
ssh.password=${SSH_PASSWORD}
ssh.strict-host-key-checking=${SSH_STRICT_HOST_KEY_CHECKING:no}
ssh.fallback-host=${SSH_FALLBACK_HOST:}
ssh.fallback-port=${SSH_FALLBACK_PORT:22}

spring.datasource.url=jdbc:postgresql://db:5432/quan_ly_server
spring.datasource.username=dashboard_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
telegram.polling-enabled=${TELEGRAM_POLLING_ENABLED:false}

# ─── Groq AI — Multi-Key Pool (9router-style round-robin) ─────────────────────
# At least GROQ_API_KEY is required. Add GROQ_API_KEY_2..5 for higher throughput.
groq.api-key=${GROQ_API_KEY:}
groq.api-key-2=${GROQ_API_KEY_2:}
groq.api-key-3=${GROQ_API_KEY_3:}
groq.api-key-4=${GROQ_API_KEY_4:}
groq.api-key-5=${GROQ_API_KEY_5:}
groq.model=llama-3.1-8b-instant
